site_name: DogWalking Domain Docs
site_url: https://datagriff.github.io/spec-dog-walking
docs_dir: docs
repo_url: https://github.com/dataGriff/spec-dog-walking
repo_name: dataGriff/spec-dog-walking

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Specifications:
    - Product Requirements: specifications/prd.md
    - Domain Model: specifications/domain-model.md
    - Glossary: specifications/glossary.md
    - Auth Matrix: specifications/auth-matrix.md
    - Error Catalogue: specifications/error-catalogue.md
    - Sequence Diagrams: specifications/sequence-diagrams.md
    - Non-Functional Requirements: specifications/nfr.md
    - Acceptance Scenarios: specifications/acceptance-scenarios.md
  # Generated HTML views live in docs/specifications/ but aren't MkDocs
  # pages, so they're linked absolutely (via site_url) to stay valid
  # from any page depth. Regenerate with `task docs:generate`.
  - Generated Views:
    - Domain Overview: https://datagriff.github.io/spec-dog-walking/specifications/domain-overview.html
    - Traceability Matrix: https://datagriff.github.io/spec-dog-walking/specifications/traceability.html
    - API Reference: https://datagriff.github.io/spec-dog-walking/specifications/api-reference.html
    - AsyncAPI Reference: https://datagriff.github.io/spec-dog-walking/specifications/asyncapi-reference.html
    - Data Contract Reference: https://datagriff.github.io/spec-dog-walking/specifications/datacontract-reference.html

# Suite bookkeeping now lives in `.spec-suite/` (outside `docs/`), so
# nothing in `docs/specifications/` needs to be hidden from the site.
# This list is intentionally empty; kept here so future spec-set
# authors know where to add per-domain exclusions if they need them.
exclude_docs: |

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
