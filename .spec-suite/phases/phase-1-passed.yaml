decisions:
- id: REMINDERS-DESCOPED-TO-NON-GOAL
  summary: Daily walk reminders removed from the domain scope statement and Goal 1;
    added as explicit Non-Goal 5.
  rationale: Critique H3 — the PRD promised reminders with zero story, endpoint, or
    event coverage. Building them means a notification subsystem (schedules, delivery
    channels, ReminderSent events) that would roughly double the scope. v1's single
    authoritative schedule replaces the fridge board; proactive delivery is deferred.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T05:30:01Z'
- id: CLIENT-CREATED-AT-ACCEPTANCE
  summary: The Client record is created when the invite is accepted, not when it is
    issued. POST /v1/clients creates an Invite only.
  rationale: Critique H6 — the spec contradicted itself three ways and the at-invite
    version was schema-impossible (required userId cannot exist before acceptance).
    At-acceptance keeps every Client row fully formed; the tradeoff (walker can't
    attach dogs/walks pre-acceptance) is accepted.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/domain-model.md
  - docs/specifications/glossary.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:30:01Z'
- id: WALKER-SELF-REGISTRATION-BACKFILLED
  summary: US-000 added — walker self-registration via POST /v1/auth/register with
    {email, password, displayName}, publishing WalkerRegistered. Registration is walker-only;
    owners join by invite.
  rationale: Critique H4 — the endpoint was invented at contract time with no story,
    no scenarios, and a Flow 1 body that didn't match the schema. The endpoint is
    genuinely needed (walkers must be able to start an instance); the story is back-filled
    and the role field never existed.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T05:30:01Z'
- id: REFRESH-AND-LOGOUT-IN-SCOPE
  summary: US-021 (POST /v1/auth/refresh, rotating) and US-022 (POST /v1/auth/logout)
    added, making the issued refreshToken usable and US-004's revocation observable.
  rationale: Critique H8/H10 — AuthResponse returned a refreshToken with a 30-day
    NFR lifetime but no endpoint could consume it, and US-004-B asserted unobservable
    revocation. Completing the surface matches the mobile-client reality the spec
    already assumes.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T05:30:01Z'
- id: WALK-PRICE-SNAPSHOT-AT-SCHEDULING
  summary: A walk records its rate-card price when it enters `scheduled`; invoices
    sum walk snapshots. Rescheduling keeps the recorded price (re-snapshot only on
    a new requested→scheduled transition).
  rationale: Critique H7 — the model pinned invoice prices to the rate at scheduling
    but nothing recorded it and PUT /v1/rate-card destroys history. Snapshot-on-Walk
    makes the invariant mechanically testable and keeps invoicing a pure read.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/domain-model.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:30:01Z'
- id: CURRENCY-CARD-LEVEL
  summary: Rate-card currency is card-level and immutable once set (409 CURRENCY_IMMUTABLE
    on change attempts); the per-entry currency field is removed from the PUT request.
  rationale: Critique M1 — request shape allowed per-entry currency the entity/event/datacontract
    could not represent, silently dropping mixed-currency input. A solo UK walker
    has no mixed-currency use case.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:30:01Z'
- id: TENANCY-404-FOR-BOTH
  summary: Cross-tenant access to id-addressed resources returns 404 RESOURCE_NOT_FOUND,
    indistinguishable from nonexistent. 403 FORBIDDEN is reserved for role denials
    on resources the requester can see (e.g. an owner completing their own walk).
    Nonexistent body-referenced ids (ownerId, dogId, clientId) also 404.
  rationale: Critique M16/M15 — the previous 403/404 split was a resource- existence
    oracle (UUID probing distinguishes "exists but not yours" from "doesn't exist")
    and body-referenced-id misses were unspecified.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/auth-matrix.md
  - docs/specifications/error-catalogue.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:30:01Z'
- id: BREED-UK-KENNEL-CLUB-OPEN-ENUM
  summary: Dog breed is a UK Kennel Club open enumeration, escalated into the PRD
    (US-005). AsyncAPI $refs the OpenAPI enum instead of downgrading to bare string;
    the datacontract references the OpenAPI schema instead of duplicating a pinned
    copy.
  rationale: Critique M3 — the contract invented a ~211-value vocabulary from a plain
    PRD string and the three contracts disagreed on strategy; an open-enum addition
    would have violated the pinned datacontract copy.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/contracts/openapi.yaml
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T05:30:01Z'
- id: INVITE-LIFECYCLE-EVENTS
  summary: InviteAccepted and InviteExpired events added so all three invite.status
    values are reachable from the stream; InviteAccepted and ClientRegistered both
    carry the invite id.
  rationale: Critique H9/M5 — only invite.created existed, so accepted and expired
    states could never appear in the historic record, and invite→client lineage was
    unjoinable without a fuzzy email match.
  affects:
  - docs/specifications/prd.md
  - docs/specifications/domain-model.md
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T05:30:01Z'
- id: PRD-CONSTRAINTS-BACKFILLED
  summary: Constraints section replaced its TODO with the UK solo-walker baseline
    (UK-only/UK GDPR/GBP/English; one walker per instance; invite-only client onboarding;
    no payment processing; API-first, no offline mode).
  rationale: Critique L4 — the section was literally "1. TODO" and slipped through
    the old placeholder check. All five constraints restate assumptions the spec already
    hard-codes.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T05:30:01Z'
- id: PRD-EVENT-BACKFILL
  summary: Story acceptance criteria now name the events they publish (WalkerRegistered,
    InviteCreated, InviteAccepted, InviteExpired, ClientRegistered, DogAdded, RateCardUpdated).
  rationale: Critique M11 — four events traced to nothing in the PRD; contract-time
    inventions must be escalated upstream, not left implicit.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T05:30:01Z'
- id: US-018-DEAD-403-REMOVED
  summary: Removed US-018's 403 FORBIDDEN acceptance criterion (owner who isn't a
    client) and replaced it with the real empty-state 404.
  rationale: In this invite-only single-walker domain every owner is by construction
    a client of the walker, so the 403 case is unreachable — the dead-403 sweep already
    removed it from the contract; the traceability matrix flagged the leftover AC.
  affects:
  - docs/specifications/prd.md
  ts: '2026-07-06T11:00:00Z'
- id: PRD-SCENARIO-CROSS-LINKS
  summary: Every user story carries a Scenarios link to its acceptance-scenarios section,
    and every scenario section links back to its story.
  rationale: 'Gate 1.4 cross-linking convention: the two documents operate at different
    altitudes deliberately; the links plus the generated traceability matrix make
    the correspondence navigable.'
  affects:
  - docs/specifications/prd.md
  - docs/specifications/acceptance-scenarios.md
  ts: '2026-07-06T11:00:00Z'
- id: TIPS-REMOVED-V1
  summary: US-019 (walker records tip at mark-paid) removed; invoices are total-only
    in v1. Story number retired.
  rationale: 'Product review of the web client: a tip is the client''s declaration,
    not the walker''s data entry, and v1 has no owner-side payment surface - the walker
    recording a tip put one party''s money in the other party''s hands (actor-of-record
    mismatch).'
  affects:
  - docs/specifications/prd.md
  - docs/specifications/acceptance-scenarios.md
  - docs/specifications/contracts/openapi.yaml
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-07T11:00:00Z'
