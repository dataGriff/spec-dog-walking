- id: US-020-VIEW-DOG-ADDED-POST-REVIEW
  summary: Added US-020 'View a single dog' to formally justify GET /v1/dogs/{dogId}
    which already existed in the contract.
  rationale: Independent review found the operation had no user story behind it. The
    endpoint is genuinely needed (mid-walk medication lookup, pre-booking detail check)
    and was implicitly assumed; making it explicit closes the coverage gap.
  affects:
  - docs/specifications/prd.md
  ts: '2026-05-31T13:20:52Z'
- id: PRD-NONGOAL-PROSE-CORRECTION
  summary: "Non-Goals \xA72 rephrased from 'walk-completion updates' to 'walk updates\
    \ posted during or after the walk' to match the actual update semantics."
  rationale: Updates can be posted while status=scheduled (live, during) or status=completed
    (post-hoc) per the modeling phase decision WALK-UPDATE-IN-SCHEDULED-AND-COMPLETED.
    The original 'completion' framing was inaccurate.
  affects:
  - docs/specifications/prd.md
  ts: '2026-05-31T13:20:52Z'
