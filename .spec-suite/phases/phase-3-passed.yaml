decisions:
- id: REFRESH-LOGOUT-AUTH-SEMANTICS
  summary: POST /v1/auth/refresh is public (the refresh token in the body is the credential,
    like invite accept); POST /v1/auth/logout requires a bearer token. Both are rate-limited
    per NFR-SEC-004.
  rationale: Critique H8 — the auth matrix declared refresh out of scope while the
    contract issued refresh tokens. Refresh must work when the access token has already
    expired, so it cannot demand a live bearer.
  affects:
  - docs/specifications/auth-matrix.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:39:45Z'
- id: INVITE-ACCEPT-RATE-LIMITED
  summary: POST /v1/invites/{token}/accept and POST /v1/auth/refresh join the NFR-SEC-004
    rate-limited set, returning 429 RATE_LIMITED with Retry-After beyond the threshold.
  rationale: Critique M17/H2 — invite acceptance was a public, token-authenticated,
    format-unconstrained brute-force surface excluded from rate limiting, while the
    NFR-mandated 429 existed nowhere downstream.
  affects:
  - docs/specifications/auth-matrix.md
  - docs/specifications/error-catalogue.md
  - docs/specifications/nfr.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:39:45Z'
- id: JWT-INVALID-SIGNATURE-MAPPED
  summary: Invalid-signature / tampered bearer tokens map to AUTHENTICATION_REQUIRED
    (401); TOKEN_EXPIRED stays reserved for valid-signature-expired so clients know
    a silent refresh fixes it.
  rationale: Critique M14 — the most common real-world 401 had no catalogue entry.
  affects:
  - docs/specifications/error-catalogue.md
  - docs/specifications/auth-matrix.md
  ts: '2026-07-06T05:39:45Z'
- id: NEVER-EXISTED-TOKENS-404
  summary: Invite / password-reset tokens that never existed return 404 RESOURCE_NOT_FOUND;
    410 Gone stays reserved for tokens that verifiably existed (expired / already
    used).
  rationale: Critique M13 — the unknown-token case had no defined response; implementers
    could not choose between 400/404/410.
  affects:
  - docs/specifications/error-catalogue.md
  - docs/specifications/prd.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:39:45Z'
- id: INSTANCE-STATUS-PUBLIC
  summary: GET /v1/instance is public and deliberately reveals walkerRegistered +
    walkerDisplayName, rate-limited at 60/min per IP.
  rationale: Single-walker instances need first-run detection so sign-in screens only
    offer walker setup on fresh instances. The display name is the storefront and
    already reaches invitees out of band; 5/min credential-grade limiting would break
    normal sign-in-screen loads.
  affects:
  - docs/specifications/auth-matrix.md
  - docs/specifications/nfr.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-07T11:00:00Z'
