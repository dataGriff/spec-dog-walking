decisions:
- id: OWNERSHIP-VIA-FK-TRAVERSAL
  summary: Ownership rule traverses Client.invitedByWalkerId (and similar) rather
    than embedding walkerId on every owned resource.
  rationale: "Single source of truth \u2014 if a Client ever moves walkers (out of\
    \ scope for v1 but possible later) the change is one row, not N."
  affects:
  - docs/specifications/auth-matrix.md
  ts: '2026-05-31T10:46:34Z'
- id: FORBIDDEN-FOR-BOTH-ROLE-AND-OWNERSHIP
  summary: FORBIDDEN (403) returned for both wrong-role and not-the-owner failures;
    the response does not distinguish.
  rationale: "Defence in depth \u2014 distinguishing leaks resource existence to a\
    \ caller with the wrong role. Same approach as the Items reference fixture."
  affects:
  - docs/specifications/auth-matrix.md
  - docs/specifications/error-catalogue.md
  ts: '2026-05-31T10:46:34Z'
- id: INVITE-AND-RESET-PUBLIC-WITH-TOKEN-AUTH
  summary: "POST /v1/invites/{token}/accept and POST /v1/auth/password-reset/confirm\
    \ are public (no BearerAuth) \u2014 the token in the URL IS the auth."
  rationale: Bearer auth on these endpoints would defeat their purpose (unauthenticated
    users follow email links). The token's single-use + TTL semantics handle authorization.
  affects:
  - docs/specifications/auth-matrix.md
  ts: '2026-05-31T10:46:34Z'
- id: AC-REQUIRES-PHASE-2-MODELING
  summary: Access Control prerequisite includes modeling (Phase 2), not just discovery.
  rationale: Ownership rules reference real entity field names (e.g. Client.invitedByWalkerId).
    Discovery alone doesn't define entities, so the AUTH-OWNERSHIP-RULE-FIELD-EXISTS
    check (planned for audit) would have nothing to validate against. SUITE-DESIGN
    didn't mandate this; chosen during build.
  affects:
  - skills/domain-access-control/gate.yaml
  ts: '2026-05-31T10:46:34Z'
- id: IDEMPOTENCY-KEY-CONFLICT-ADDED
  summary: Added `IDEMPOTENCY_KEY_CONFLICT` (409) to the error catalogue, paired
    with the suite v1.0.9 `Idempotency-Key` convention on POST ops.
  rationale: |
    When a client retries a POST with the same `Idempotency-Key` but a changed
    request body, the server must refuse the second call rather than honour the
    cached response (which is for a different intent) or process the new body
    (which destroys the safety guarantee). 409 is the right HTTP status for the
    semantic-mismatch case. Lives under "Conflict errors (409)" alongside the
    existing 409 codes.
  affects:
  - docs/specifications/error-catalogue.md
  ts: '2026-06-02T10:00:00Z'
