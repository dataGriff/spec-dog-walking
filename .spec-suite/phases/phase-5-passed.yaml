decisions:
- id: EVENT-DELIVERY-AT-LEAST-ONCE
  summary: NFR-AVAIL-002 rewritten from best-effort publication to a transactional-outbox
    at-least-once guarantee; NFR-PERF-002's budget covers the synchronous outbox write,
    broker relay off the request path.
  rationale: "Critique M19 \u2014 best-effort delivery contradicted the asyncapi's\
    \ reconstruct-the-history completeness claim and the datacontract tables consumers\
    \ were told to trust."
  affects:
  - docs/specifications/nfr.md
  ts: '2026-07-06T05:49:06Z'
- id: STORAGE-QUOTA-CODE
  summary: NFR-DATA-003 quota exhaustion now returns 409 STORAGE_QUOTA_EXCEEDED (new
    catalogue entry) instead of repurposing VALIDATION_ERROR.
  rationale: "Critique L14 \u2014 quota exhaustion is a state condition of the instance,\
    \ not a defect in the request; a byte-identical upload succeeds after space is\
    \ freed."
  affects:
  - docs/specifications/nfr.md
  - docs/specifications/error-catalogue.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:49:06Z'
- id: PRIVACY-NFR-DEFAULTS
  summary: NFR-PRIV-001/002/003 added per the suite template with UK GDPR defaults
    - 24-month post-closure retention ceiling (invoices anonymised at the ceiling,
    kept to the 84-month accounting floor), 30-day manual DSR process, explicit PII
    inventory. All numbers provisional pending real policy input.
  rationale: "Critique M18 \u2014 substantial UK PII with retention floors but no\
    \ ceilings and deletion deferred wholesale."
  affects:
  - docs/specifications/nfr.md
  ts: '2026-07-06T05:49:06Z'
- id: WALK-UPDATES-UNPAGINATED
  summary: GET /v1/walks/{walkId}/updates stays unpaginated by design; GET /v1/clients
    added to the NFR-PERF-006 pagination list.
  rationale: "Critique L14 \u2014 updates are bounded per walk and the timeline is\
    \ only meaningful whole; clients list was an accidental omission from the pagination\
    \ ceiling."
  affects:
  - docs/specifications/nfr.md
  ts: '2026-07-06T05:49:06Z'
- id: SCENARIO-CONVENTIONS-ADOPTED
  summary: Scenarios rewritten to the suite's authoring rules - actor + state Givens
    everywhere, contract-legal literals, bare schema property paths, an explicit Idempotency-Key
    convention with replay/conflict/missing-key scenarios, and coverage for every
    operation including refresh, logout, register, listClients, listDogs, pagination,
    rate limiting, auth failures, and the rate-change invoicing invariant.
  rationale: "Critique M7/M8/M9/M12/L12 \u2014 scenario literals violated the contracts\
    \ they test, response paths asserted wrapped keys the contracts never return,\
    \ no POST scenario supplied the required Idempotency-Key, and whole operations/error\
    \ paths had no scenario."
  affects:
  - docs/specifications/acceptance-scenarios.md
  ts: '2026-07-06T05:49:06Z'
- id: TRACEABILITY-FLAGS-CLOSED
  summary: 'Added the failure scenarios the traceability matrix flagged: US-007-E,
    US-008-D, US-011-D, US-012-I/J (visibility 404s and owner-role 403s).'
  rationale: Each flagged AC named a status/error code no scenario asserted; the new
    scenarios make the 404-for-invisible / 403-for-visible-but-forbidden split executable
    per story.
  affects:
  - docs/specifications/acceptance-scenarios.md
  ts: '2026-07-06T11:00:00Z'
