decisions:
- id: VALIDATION-ENVELOPE-CARRIES-DOMAIN-400S
  summary: The ValidationError schema's code enum now admits the domain-specific 400
    codes (INVALID_WALK_TYPE, INVALID_PHOTO, NO_BILLABLE_WALKS) alongside VALIDATION_ERROR;
    the Error schema gains INVALID_REFRESH_TOKEN, IDEMPOTENCY_KEY_CONFLICT, CURRENCY_IMMUTABLE,
    STORAGE_QUOTA_EXCEEDED, and RATE_LIMITED, and every keyed POST declares a 409
    for idempotency reuse.
  rationale: Critique H1 — the catalogue promised codes no compliant server could
    emit (400 bindings admitted only VALIDATION_ERROR; IDEMPOTENCY_KEY_CONFLICT had
    no binding anywhere). Verified by the new ERROR-CODE-REPRESENTABLE gate.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T06:07:45Z'
- id: INVITE-RESPONSE-REPLACES-CLIENTCREATERESPONSE
  summary: addClient 201 returns the Invite schema (token excluded); ClientCreateResponse
    (clientId + inviteId) deleted. The openapi Invite/User schemas no longer carry
    [secret] fields at all.
  rationale: Critique H6/L5 — the old response asserted a Client that cannot exist
    before acceptance, and the dead schemas advertised secrets. Depends on suite gate
    1.3 (FIELD-MATCH secret exemption, domain-spec-suite PR
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T06:07:45Z'
- id: ASYNCAPI-BREED-MIRROR-DATACONTRACT-REF
  summary: asyncapi declares Breed as an exact mirror of openapi's open enum (generated
    from it) and Dog envelopes $ref it; the datacontract drops its pinned 211-value
    copy for a qualified openapi.yaml#/components/schemas/Breed ref. Additions are
    one minor bump in one place.
  rationale: Critique M3 — three contracts, three strategies; an open addition would
    have passed API and event but violated the pinned datacontract copy.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T06:07:45Z'
- id: PER-CHANNEL-STATUS-PINNING
  summary: Every lifecycle channel pins its payload status to the single legal value
    (walk.requested can never claim completed); the full WalkStatus/InvoiceStatus/InviteStatus
    enums are no longer declared in asyncapi. CloudEvents overlays now require data;
    walk envelopes regain durationMinutes minimum 1 and gain priceCents (required
    on scheduled/completed, nullable elsewhere); WalkDeclined's declinedReason is
    nullable per the PRD's optional reason.
  rationale: Critique L9/L8/L7/M2 plus H7's snapshot propagation.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T06:07:45Z'
- id: EVENT-PK-NAMING-RETAINED
  summary: Events keep <entity>Id at payload root (walkId, dogId) with id for nested
    aggregate children, while REST entities use bare id; channel names stay unversioned
    flat-concatenated (dogwalking.walkupdate.posted). Both asymmetries are deliberate
    and now recorded rather than accidental.
  rationale: Critique L10/L11 — renaming channels or payload keys is a breaking change
    to every consumer for purely cosmetic symmetry; the suite's own convention (asyncapi
    SKILL) endorses <entity>Id at root.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  ts: '2026-07-06T06:07:45Z'
- id: INVOICE-LIST-BALANCE-OWED
  summary: listInvoices gains from/to issue-date filters and the list response carries
    balanceOwedCents (sum of totalCents over issued invoices across the whole filtered
    set).
  rationale: Critique M4 — US-015 required both and the contract dropped them; owners
    had no running view of money owed.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T06:07:45Z'
- id: DATACONTRACT-SLA-ENRICHED
  summary: Added the latency (freshness) slaProperty — 60s from transition commit
    to event readability — and record-level type:text quality expectations to every
    record.
  rationale: 'Gate 1.4 DATACONTRACT-SLA-COMPLETE: consumers building on the historic
    record need a freshness guarantee, not just availability and retention; 60s follows
    from the transactional-outbox delivery semantics in NFR-AVAIL-002.'
  affects:
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T11:00:00Z'
- id: LIST-400-DECLARED
  summary: All four paginated list operations (listClients, listDogs, listWalks, listInvoices)
    now declare the 400 ValidationError response alongside their existing statuses.
  rationale: 'Found during the app-dog-walking implementation: scenario US-010-C asserts
    GET /v1/walks?pageSize=51 returns 400, and the pagination parameters (pageSize
    maximum 50, NFR PERF-006) make oversized page requests rejectable on every list
    — but the contract declared no 400 for any of them. Scenario and parameters were
    right; the response lists were incomplete.'
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T13:01:50Z'
