decisions:
- id: INVOICELINEITEM-PRICECENTS-MIN-1
  summary: 'Tightened InvoiceLineItem.priceCents from minimum: 0 to minimum: 1 to
    match RateCardEntry.priceCents (strictly positive) and the domain-model contract.'
  rationale: 'InvoiceLineItem always copies from a RateCardEntry which is already
    minimum: 1, so a 0-price line item is unreachable in practice; the original 0-permissive
    minimum was wrong. Added a description to make the relationship explicit.'
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: OPENAPI-BREED-SCHEMA
  summary: Added Breed schema component; Dog.breed (and DogCreateRequest / DogPatchRequest
    variants) reference it via $ref. Adds enum constraint enforced by ENUM-VALUES-CONSISTENT.
  rationale: Removes the free-text string in favour of a constrained closed set so
    client code generators (and impl-side validation) refuse unknown values at the
    API boundary.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: EVENTS-CARRY-FULL-ENTITY-STATE
  summary: Fattened every asyncapi event payload + matching datacontract record to
    carry the full state of its affected entity at the moment of the event (minus
    [secret]-marked fields).
  rationale: "Per SUITE-DESIGN \xA74.5 the data contract must be the audit-grade historic\
    \ record \u2014 downstream consumers (analytics, audit log, time-travel reconstruction)\
    \ need to recover what happened from the event stream alone. Previously DogAdded\
    \ carried `{dogId, ownerId, name}` and DogUpdated carried field *names* without\
    \ values; consumers had to re-query the API for any other field. Now every entity\
    \ event carries its complete state. Single-entity coverage; aggregate-child collections\
    \ (RateCard entries, Invoice line items) deferred to v1.0.7."
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-01T17:59:47Z'
- id: ASYNCAPI-BREED-SCHEMA-MIRROR
  summary: 'Added Breed schema to asyncapi.yaml mirroring the openapi declaration
    so DogAdded/DogUpdated payloads can `$ref` it instead of inlining `type: string`.'
  rationale: "Without the schema reference, payload validation would accept any string\
    \ for breed \u2014 defeating the enum. ENUM-VALUES-CONSISTENT now verifies all\
    \ three contracts agree on Breed values."
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: WALKUPDATE-ID-RENAMED-FROM-UPDATEID
  summary: "Renamed asyncapi + datacontract field `updateId` \u2192 `walkUpdateId`\
    \ to match the `<entity>Id` convention recognized by EVENT-PAYLOAD-COVERS-ENTITY-STATE."
  rationale: The check accepts model `id` mapping to payload `<entity>Id`. For `WalkUpdate.id`
    that's `walkUpdateId`. The previous `updateId` shorthand was ambiguous and caught
    by the new check.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-01T17:59:47Z'
- id: DATACONTRACT-HTML-EXPORT-CONVENTION
  summary: Datacontract is published as a standalone HTML reference at docs/specifications/datacontract-reference.html
    via `datacontract export html`, joining api-reference.html and asyncapi-reference.html
    as the third peer contract reference on the spec site.
  rationale: Per suite v1.0.7 the datacontract CLI's HTML exporter is the official
    rendering path for ODCS contracts. Wired into `task docs:render-datacontract`,
    invoked by `docs:generate` so the page is regenerated on every docs build and
    gh-deploy. Rendering is a site-build concern; DATACONTRACT-LINT already proves
    the YAML is exportable so no Phase 6 check is added. Inline data-contract tables
    in domain-overview.html were trimmed in favour of a link-out to the new reference.
  affects:
  - Taskfile.yml
  - scripts/generate_domain_overview.py
  - docs/index.md
  - .github/workflows/docs.yml
  ts: '2026-06-01T19:17:00Z'
- id: DATACONTRACT-ENUMS-FOR-DATA-QUALITY
  summary: Every datacontract field that maps to a named enum (Role, WalkStatus,
    InvoiceStatus, InviteStatus, PhotoContentType, and the open Breed) now
    declares the enum values inline plus a `ref` to the matching
    `components.schemas.<Name>` so downstream data pipelines can validate
    received values against a constrained set.
  rationale: |
    Without enum constraints on the datacontract fields, a downstream pipeline
    consuming the event stream had no way to assert "the breed field is one of
    these 211 values" or "the status field is one of these 2 values" — only the
    description. A typo in an event payload (e.g. mixed-case `Labrador`,
    misspelt status `paud`) would land in the warehouse and break aggregate
    queries silently. Declaring `enum: [...]` at the datacontract level gives
    the data platform a first-class validation hook, and ENUM-VALUES-CONSISTENT
    now cross-checks all three contracts (openapi, asyncapi, datacontract) for
    the 6 closed + 1 open enum. The `ref` field keys the cross-check to the
    model's named enum without altering the wire schema. Breed's full
    211-value list is mirrored here (matching openapi); drift between openapi
    and datacontract would fail the cross-check.
  affects:
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-03T10:30:00Z'
- id: ENUMS-NAMED-AND-BREED-OPENED
  summary: 6 implicit enums (Role, WalkStatus, InvoiceStatus, InviteStatus,
    PasswordResetTokenStatus, PhotoContentType) promoted to named
    `components.schemas` entries and `$ref`-ed throughout openapi + asyncapi;
    Breed expanded to the UK Kennel Club ~190-value list and marked open.
  rationale: |
    Per suite v1.0.12 the `### Breed (open)` marker means the openapi schema
    is the authoritative full list; ENUM-VALUES-CONSISTENT verifies the
    model's representative subset is contained within. Adding a breed is now
    a minor-version bump on the openapi schema alone — no model change
    required unless the new breed deserves the canonical-examples table.
    AsyncAPI Breed schema dropped: events only carry values the API has
    already validated; the asyncapi `breed` field is `{ type: string }`.
    AsyncAPI PasswordResetTokenStatus also dropped: no event publishes
    reset tokens. The other 5 enums are mirrored in asyncapi for
    payload-validation symmetry.
  affects:
  - docs/specifications/contracts/openapi.yaml
  - docs/specifications/contracts/asyncapi.yaml
  ts: '2026-06-03T10:00:00Z'
- id: IDEMPOTENCY-KEY-CONVENTION
  summary: Every POST operation declares a required `Idempotency-Key` header
    parameter via `$ref` to `components.parameters.IdempotencyKey` (UUID per
    intent), per suite v1.0.9.
  rationale: |
    Mobile / agentic / chat clients retry mutating calls on timeout or ambiguous
    response. Without an idempotency key the server can't distinguish "do this
    twice" from "the response was lost; retry" — and POST creates new state from
    scratch, so the wrong choice produces duplicates (two walks scheduled, two
    invoices marked paid). Stripe / IETF
    `draft-ietf-httpapi-idempotency-key-header` is the standard convention; the
    server stores `{key → response}` for ~24h and replays the stored response on
    retry. PUT/PATCH/DELETE are verb-idempotent so the header is optional there;
    not enforced on those verbs. The reusable parameter lives under
    `components.parameters.IdempotencyKey` and is referenced from all 13 POST
    operations. Phase 6 + audit check `IDEMPOTENCY-KEY-ON-POST-OPS` enforces
    presence on every POST.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-02T10:00:00Z'
- id: AGGREGATE-CHILD-COVERAGE
  summary: RateCardUpdated, InvoiceIssued, InvoicePaid, and WalkUpdatePosted now
    carry their child collections in both asyncapi (`entries`, `lineItems`,
    `photos`) and datacontract (nested ODCS array fields), per suite v1.0.8.
  rationale: |
    Per suite v1.0.8 the `## Aggregates` section in domain-model.md declares three
    aggregate roots: RateCard → RateCardEntry → entries, Invoice → InvoiceLineItem
    → lineItems, and WalkUpdate → Photo → photos.
    EVENT-PAYLOAD-COVERS-ENTITY-STATE enforces that every event on an aggregate
    root carries its full child collection — both in the asyncapi payload (new
    `RateCardEntryPayload`, `InvoiceLineItemPayload`, and `PhotoPayload` schemas
    referenced via array items in the four envelopes) and in the datacontract
    record (nested array fields on `ratecard`, `invoice`, and `walkupdate`,
    ODCS `logicalType` array). The v1.0.6/v1.0.7 docstrings claiming the children
    were "intentionally NOT" in the payloads were removed. InvoicePaid is also
    an event on the Invoice aggregate root so it carries `lineItems` too.
    WalkUpdate is itself a first-class entity (with its own WalkUpdatePosted
    event) and also an aggregate root over Photo — Photo has no separate event
    or write API, so it qualifies.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-02T09:00:00Z'
