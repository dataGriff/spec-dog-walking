decisions:
- id: INVOICELINEITEM-PRICECENTS-MIN-1
  summary: 'Tightened InvoiceLineItem.priceCents from minimum: 0 to minimum: 1 to
    match RateCardEntry.priceCents (strictly positive) and the domain-model contract.'
  rationale: 'InvoiceLineItem always copies from a RateCardEntry which is already
    minimum: 1, so a 0-price line item is unreachable in practice; the original 0-permissive
    minimum was wrong. Added a description to make the relationship explicit.'
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: OPENAPI-BREED-SCHEMA
  summary: Added Breed schema component; Dog.breed (and DogCreateRequest / DogPatchRequest
    variants) reference it via $ref. Adds enum constraint enforced by ENUM-VALUES-CONSISTENT.
  rationale: Removes the free-text string in favour of a constrained closed set so
    client code generators (and impl-side validation) refuse unknown values at the
    API boundary.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: EVENTS-CARRY-FULL-ENTITY-STATE
  summary: Fattened every asyncapi event payload + matching datacontract record to
    carry the full state of its affected entity at the moment of the event (minus
    [secret]-marked fields).
  rationale: "Per SUITE-DESIGN \xA74.5 the data contract must be the audit-grade historic\
    \ record \u2014 downstream consumers (analytics, audit log, time-travel reconstruction)\
    \ need to recover what happened from the event stream alone. Previously DogAdded\
    \ carried `{dogId, ownerId, name}` and DogUpdated carried field *names* without\
    \ values; consumers had to re-query the API for any other field. Now every entity\
    \ event carries its complete state. Single-entity coverage; aggregate-child collections\
    \ (RateCard entries, Invoice line items) deferred to v1.0.7."
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-01T17:59:47Z'
- id: ASYNCAPI-BREED-SCHEMA-MIRROR
  summary: 'Added Breed schema to asyncapi.yaml mirroring the openapi declaration
    so DogAdded/DogUpdated payloads can `$ref` it instead of inlining `type: string`.'
  rationale: "Without the schema reference, payload validation would accept any string\
    \ for breed \u2014 defeating the enum. ENUM-VALUES-CONSISTENT now verifies all\
    \ three contracts agree on Breed values."
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  ts: '2026-06-01T17:59:47Z'
- id: WALKUPDATE-ID-RENAMED-FROM-UPDATEID
  summary: "Renamed asyncapi + datacontract field `updateId` \u2192 `walkUpdateId`\
    \ to match the `<entity>Id` convention recognized by EVENT-PAYLOAD-COVERS-ENTITY-STATE."
  rationale: The check accepts model `id` mapping to payload `<entity>Id`. For `WalkUpdate.id`
    that's `walkUpdateId`. The previous `updateId` shorthand was ambiguous and caught
    by the new check.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-01T17:59:47Z'
