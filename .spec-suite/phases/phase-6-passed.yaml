  - scripts/generate_domain_overview.py
  - docs/index.md
  - .github/workflows/docs.yml
  ts: '2026-06-01T19:17:00Z'
- id: IDEMPOTENCY-KEY-CONVENTION
  summary: Every POST operation declares a required `Idempotency-Key` header
    parameter via `$ref` to `components.parameters.IdempotencyKey` (UUID per
    intent), per suite v1.0.9.
  rationale: |
    Mobile / agentic / chat clients retry mutating calls on timeout or ambiguous
    response. Without an idempotency key the server can't distinguish "do this
    twice" from "the response was lost; retry" — and POST creates new state from
    scratch, so the wrong choice produces duplicates (two walks scheduled, two
    invoices marked paid). Stripe / IETF
    `draft-ietf-httpapi-idempotency-key-header` is the standard convention; the
    server stores `{key → response}` for ~24h and replays the stored response on
    retry. PUT/PATCH/DELETE are verb-idempotent so the header is optional there;
    not enforced on those verbs. The reusable parameter lives under
    `components.parameters.IdempotencyKey` and is referenced from all 13 POST
    operations. Phase 6 + audit check `IDEMPOTENCY-KEY-ON-POST-OPS` enforces
    presence on every POST.
  affects:
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-02T10:00:00Z'
- id: AGGREGATE-CHILD-COVERAGE
  summary: RateCardUpdated, InvoiceIssued, InvoicePaid, and WalkUpdatePosted now
    carry their child collections in both asyncapi (`entries`, `lineItems`,
    `photos`) and datacontract (nested ODCS array fields), per suite v1.0.8.
  rationale: |
    Per suite v1.0.8 the `## Aggregates` section in domain-model.md declares three
    aggregate roots: RateCard → RateCardEntry → entries, Invoice → InvoiceLineItem
    → lineItems, and WalkUpdate → Photo → photos.
    EVENT-PAYLOAD-COVERS-ENTITY-STATE enforces that every event on an aggregate
    root carries its full child collection — both in the asyncapi payload (new
    `RateCardEntryPayload`, `InvoiceLineItemPayload`, and `PhotoPayload` schemas
    referenced via array items in the four envelopes) and in the datacontract
    record (nested array fields on `ratecard`, `invoice`, and `walkupdate`,
    ODCS `logicalType` array). The v1.0.6/v1.0.7 docstrings claiming the children
    were "intentionally NOT" in the payloads were removed. InvoicePaid is also
    an event on the Invoice aggregate root so it carries `lineItems` too.
    WalkUpdate is itself a first-class entity (with its own WalkUpdatePosted
    event) and also an aggregate root over Photo — Photo has no separate event
    or write API, so it qualifies.
  affects:
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-02T09:00:00Z'
