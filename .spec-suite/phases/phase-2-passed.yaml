decisions:
- id: AUTH-TOKENS-NOT-DOMAIN-ENTITIES
  summary: PasswordResetToken demoted from `## Entities` to a new `## Supporting auth
    records` section, which also documents RefreshToken (previously unmodelled despite
    rules depending on it). Neither is published to the event stream or data contract.
  rationale: "Critique H10/L5 \u2014 token records are auth mechanics carrying secrets,\
    \ with no consumer value in the historic record; modelling them as entities forced\
    \ dead openapi schemas. Their behaviour stays fully specified and observable via\
    \ the auth endpoints (INVALID_REFRESH_TOKEN on refresh, RESET_TOKEN_* on confirm)."
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:36:01Z'
- id: USER-AND-WALKER-EVENTS
  summary: UserRegistered (published on walker registration and invite acceptance)
    and WalkerRegistered events added, with matching channels, so User and Walker
    exist in the historic record and the stream's walkerId/userId FKs resolve.
  rationale: "Critique H5 \u2014 Walker and User were invisible to the event stream,\
    \ leaving dangling FKs in four datacontract tables and contradicting the stream's\
    \ reconstruct-without-the-API claim."
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-07-06T05:36:01Z'
- id: REQUESTED-CANCEL-IS-OWNER-WITHDRAWAL
  summary: "requested\u2192cancelled is owner withdrawal only; the walker's route\
    \ out of `requested` is the decision endpoint (decline). Either party cancels\
    \ a `scheduled` walk. A walker cancel attempt on a `requested` walk returns 403\
    \ FORBIDDEN."
  rationale: "Critique M10 \u2014 model prose said \"either party\", the lifecycle\
    \ table said owner-only, and the auth matrix said unconditional walker cancel.\
    \ Owner-only keeps decline (with its recorded reason) the single walker path out\
    \ of `requested`."
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/auth-matrix.md
  ts: '2026-07-06T05:36:01Z'
- id: WALK-PRICE-SNAPSHOT-ATTRIBUTE
  summary: "Walk gains nullable priceCents, snapshotted at the requested\u2192scheduled\
    \ transition (or at creation for walker-created walks); InvoiceLineItem.priceCents\
    \ copies it. There is no reschedule endpoint in v1, so no re-snapshot path exists."
  rationale: "Critique H7 \u2014 the recorded-price invariant had no recording mechanism;\
    \ PUT /v1/rate-card wholesale-replaces entries and would have destroyed the pricing\
    \ history invoices depend on."
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/glossary.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-07-06T05:36:01Z'
