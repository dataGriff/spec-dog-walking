decisions:
- id: INVOICELINEITEM-PRICE-AT-SCHEDULED-NOT-ISSUE
  summary: 'Disambiguated InvoiceLineItem.priceCents snapshot timing: captured at
    the Walk''s scheduled transition, NOT at invoice issue.'
  rationale: Original Business Rules text said 'snapshotted at issue' which contradicted
    the attribute description ('in force at scheduled transition') and the M6.2 decision
    INVOICE-LINEITEM-FK-PLUS-COPY. The whole point of denormalising walkType/durationMinutes
    onto LineItem is to preserve the agreed price; locking at scheduled is the right
    semantic. Independent review surfaced the contradiction.
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-06-01T17:58:57Z'
- id: WALKER-NO-API-SURFACE-EXPLICIT
  summary: Documented that Walker has no dedicated REST API in v1 (single-walker constraint);
    access is via auth/register, GET /v1/rate-card, and embedded walker data on Walk
    responses.
  rationale: 'Independent review noticed Walker is modeled as a first-class entity
    but no API exposes it. That''s intentional (non-goal: no multi-walker teams) but
    wasn''t explicit; an implementer might add unnecessary endpoints. Now stated in
    Walker''s Business Rules.'
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-06-01T17:58:57Z'
- id: GLOSSARY-INVOICE-INDEFINITE-ISSUED
  summary: Glossary Invoice entry clarified that an invoice can remain `issued` indefinitely
    (it's not guaranteed to move to `paid`).
  rationale: "Original wording 'status moves issued \u2192 paid' implied paid was\
    \ inevitable. In reality some invoices stay issued forever (client never pays).\
    \ Minor prose for accuracy."
  affects:
  - docs/specifications/glossary.md
  ts: '2026-06-01T17:58:57Z'
- id: BREED-CLOSED-ENUM
  summary: Dog.breed is a closed enum (12 values) rather than free-text string.
  rationale: Breed varies widely but the walker workforce sees a stable top-10 list
    day-to-day. Closing the set with `mixed` + `unknown` fallbacks gives the API a
    queryable + reportable column without forcing owners into free-text. Extending
    the list is a minor-version openapi bump per NFR-COMPAT-001.
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/contracts/openapi.yaml
  ts: '2026-06-01T17:58:57Z'
- id: SECRET-MARKER-ON-TOKENS-AND-PASSWORDHASH
  summary: "Marked User.passwordHash, Invite.token, PasswordResetToken.token as `[secret]`\
    \ in the model \u2014 never published to events or the data contract."
  rationale: "Per SUITE-DESIGN \xA74.5 the `[secret]` marker excludes a field from\
    \ the must-appear-in-events set enforced by EVENT-PAYLOAD-COVERS-ENTITY-STATE.\
    \ All three are security-sensitive: password hash gives offline cracking surface;\
    \ opaque tokens grant one-shot privilege escalation. They stay in the model +\
    \ OpenAPI request/response shapes where the API boundary needs them, but the historic\
    \ event record does not."
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-06-01T17:58:57Z'
- id: INVITE-CREATED-EVENT-RENAMED
  summary: Renamed `ClientInvited` event (channel `dogwalking.client.invited`) to
    `InviteCreated` (channel `dogwalking.invite.created`).
  rationale: "The event fires when an Invite is created, not when a Client is created\
    \ (Client doesn't exist until invite acceptance). The old name forced the EVENT-PAYLOAD-COVERS-ENTITY-STATE\
    \ check to require Client fields in the payload \u2014 but no Client record exists\
    \ at that point. Renaming aligns the channel to the entity actually created."
  affects:
  - docs/specifications/domain-model.md
  - docs/specifications/sequence-diagrams.md
  - docs/specifications/acceptance-scenarios.md
  - docs/specifications/contracts/asyncapi.yaml
  - docs/specifications/contracts/datacontract.yaml
  ts: '2026-06-01T17:58:57Z'
- id: AGGREGATES-SECTION-ADDED
  summary: Added a `## Aggregates` section to domain-model.md declaring three
    aggregate roots \u2014 `RateCard \u2192 RateCardEntry \u2192 entries`,
    `Invoice \u2192 InvoiceLineItem \u2192 lineItems`, and
    `WalkUpdate \u2192 Photo \u2192 photos`.
  rationale: |
    Per suite v1.0.8 the `## Aggregates` section is the normative declaration of
    aggregate-root \u2192 child-collection relationships consumed by
    EVENT-PAYLOAD-COVERS-ENTITY-STATE. Aggregate criterion: the child has no
    independent event or write API, and is created/mutated only through the
    parent. RateCardEntry, InvoiceLineItem, and Photo all qualify \u2014 Photo is
    created atomically with the WalkUpdate (POST /v1/walks/{walkId}/updates
    with binary photo array), has only a GET-by-id later, and fires no event
    of its own (only WalkUpdatePosted). Other has-many relationships in the
    model (Walker \u2192 Client, Walker \u2192 Invoice, Walk \u2192 WalkUpdate, etc.) have
    children that are first-class entities with their own APIs and events,
    so they are not aggregates.
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-06-02T09:00:00Z'
