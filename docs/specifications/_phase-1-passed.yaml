  ts: '2026-05-31T10:45:55Z'
- id: PRD-PERSONA-NAME-FROM-PERSONA-VIEW
  summary: Dog Owner persona name reads from her own perspective, not Alison's ('Client').
  rationale: Both personas use this app; each should describe themselves the way they
    would, not the way the other party labels them.
  affects:
  - docs/specifications/prd.md
  ts: '2026-05-31T10:45:55Z'
- id: US-019-TIP-AS-OPTIONAL-PAID-FIELD
  summary: Modelled tipping as an optional `tipCents` integer on the mark-paid request
    rather than a separate `tip-invoice` endpoint.
  rationale: Tip is recorded at the same moment as the invoice payment; separate endpoint
    would split a single business event into two and complicate the InvoicePaid event
    payload.
  affects:
  - docs/specifications/prd.md
  ts: '2026-05-31T10:45:55Z'
