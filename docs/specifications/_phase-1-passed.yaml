- id: PRD-PERSONA-COUNT-TWO
  summary: Captured two personas (Solo Dog Walker, Dog Owner) rather than walker-only.
  rationale: Clancy is a real user with her own goals (book, cancel, see schedule,
    pay); collapsing her out would hide half the domain motivation.
  affects:
