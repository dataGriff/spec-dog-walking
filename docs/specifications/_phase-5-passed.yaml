  ts: '2026-05-31T10:47:18Z'
rubric_findings:
- id: RUBRIC-NFR-REALISTIC
  verdict: pass
  detail: Performance and availability thresholds are scaled for a realistic single-walker
    workload (5 rps steady, 50 clients / 100 dogs / 1000 walks / 100 invoices). Retention
    windows tied to UK/EU/US accounting conventions.
  response: resolved
  reason: agent verdict accepted
  ts: '2026-05-31T10:47:18Z'
decisions:
- id: AVAIL-TARGET-99-5
  summary: Set NFR-AVAIL-001 API uptime to 99.5% (not 99.9%).
  rationale: "Realistic single-walker SaaS target \u2014 99.9% costs meaningfully\
    \ more without proportional value at this scale. 99.5% is ~220 minutes/month of\
    \ unavailability, acceptable for a single-walker tool."
  affects:
  - docs/specifications/nfr.md
  ts: '2026-05-31T10:47:18Z'
- id: INVOICE-RETENTION-84-MONTHS
  summary: NFR-DATA-002 sets invoice retention to 84 months (7 years).
  rationale: Conventional accounting record-keeping period for small businesses in
    UK / EU / US contexts. Shorter retention risks compliance issues; longer adds
    storage cost without business value.
  affects:
  - docs/specifications/nfr.md
  ts: '2026-05-31T10:47:18Z'
- id: PHOTO-CAP-10GB-PER-WALKER
  summary: NFR-DATA-003 caps total stored photo bytes at 10 GB per walker.
  rationale: Single-walker scale rarely needs more (~5,000 photos at 2MB avg). Cap
    protects storage budget; 9 GB triggers observability so the user can curate before
    hitting the hard cap.
  affects:
  - docs/specifications/nfr.md
  ts: '2026-05-31T10:47:18Z'
- id: LOAD-PROFILE-5RPS-STEADY-STATE
  summary: All performance NFRs (PERF-001/002/003) reference a 5 rps steady-state
    load profile.
  rationale: "Single-walker workload (one walker, ~20 clients, ~30 walks/day) wouldn't\
    \ realistically exceed 5 rps. Setting thresholds against a realistic profile keeps\
    \ them honest \u2014 calibrating against 100 rps would make latency budgets meaningless."
  affects:
  - docs/specifications/nfr.md
  ts: '2026-05-31T10:47:18Z'
- id: TIPPING-NFR-DEFERRED
  summary: No new NFR added for tipping; inherits NFR-PERF-002 write-latency budget.
  rationale: Tipping is a single integer added to an existing request; it doesn't
    change the operation's compute or storage profile.
  affects:
  - docs/specifications/acceptance-scenarios.md
  ts: '2026-05-31T10:47:18Z'
