decisions:
- id: INVOICELINEITEM-PRICE-AT-SCHEDULED-NOT-ISSUE
  summary: 'Disambiguated InvoiceLineItem.priceCents snapshot timing: captured at
    the Walk''s scheduled transition, NOT at invoice issue.'
  rationale: Original Business Rules text said 'snapshotted at issue' which contradicted
    the attribute description ('in force at scheduled transition') and the M6.2 decision
    INVOICE-LINEITEM-FK-PLUS-COPY. The whole point of denormalising walkType/durationMinutes
    onto LineItem is to preserve the agreed price; locking at scheduled is the right
    semantic. Independent review surfaced the contradiction.
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-05-31T13:21:16Z'
- id: WALKER-NO-API-SURFACE-EXPLICIT
  summary: Documented that Walker has no dedicated REST API in v1 (single-walker constraint);
    access is via auth/register, GET /v1/rate-card, and embedded walker data on Walk
    responses.
  rationale: 'Independent review noticed Walker is modeled as a first-class entity
    but no API exposes it. That''s intentional (non-goal: no multi-walker teams) but
    wasn''t explicit; an implementer might add unnecessary endpoints. Now stated in
    Walker''s Business Rules.'
  affects:
  - docs/specifications/domain-model.md
  ts: '2026-05-31T13:21:16Z'
- id: GLOSSARY-INVOICE-INDEFINITE-ISSUED
  summary: Glossary Invoice entry clarified that an invoice can remain `issued` indefinitely
    (it's not guaranteed to move to `paid`).
  rationale: "Original wording 'status moves issued \u2192 paid' implied paid was\
    \ inevitable. In reality some invoices stay issued forever (client never pays).\
    \ Minor prose for accuracy."
  affects:
  - docs/specifications/glossary.md
  ts: '2026-05-31T13:21:16Z'
