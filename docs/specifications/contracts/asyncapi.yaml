asyncapi: 2.6.0
info:
  title: Dog Walking Domain Events
  version: 1.0.0
  description: |
    Domain event contract for the **Dog Walking** domain. Events are
    emitted on every business-meaningful change: invites created,
    clients registered, dogs added and updated, walks moving through
    their lifecycle, walk updates posted, rate cards updated, invoices
    issued and paid.

    Per SUITE-DESIGN §4.5, every event payload carries the **full
    domain state** of its affected entity at the moment of the event
    (minus [secret]-marked fields). The data contract records that
    state. Together they form the audit-grade historic record —
    downstream consumers can reconstruct what happened from the event
    stream alone, without re-querying the live API.

    All events conform to the [CloudEvents 1.0](https://cloudevents.io/)
    specification. The transport binding for development is declared
    in the `servers` section below; productionised deployments may
    choose any binding compatible with the channel definitions.
  contact:
    name: Dog Walking Domain Spec Set
    url: https://example.com/dogwalking
    email: noreply@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  development:
    url: amqp://localhost:5672
    protocol: amqp
    description: Local AMQP broker (development binding)

defaultContentType: application/json

tags:
  - name: Users
    description: User-registration events.
  - name: Walkers
    description: Walker-lifecycle events.
  - name: Invites
    description: Invite-lifecycle events.
  - name: Clients
    description: Client-lifecycle events.
  - name: Dogs
    description: Dog-lifecycle events.
  - name: Walks
    description: Walk-lifecycle events.
  - name: WalkUpdates
    description: WalkUpdate-lifecycle events.
  - name: RateCard
    description: RateCard-lifecycle events.
  - name: Invoices
    description: Invoice-lifecycle events.

channels:
  dogwalking.user.registered:
    description: >
      Published whenever a User record is minted — walker
      self-registration (POST /v1/auth/register) or invite acceptance
      (POST /v1/invites/{token}/accept).
    publish:
      operationId: onUserRegistered
      description: On user registered consumer.
      message: { $ref: '#/components/messages/UserRegistered' }
  dogwalking.walker.registered:
    description: Published when the instance's walker self-registers.
    publish:
      operationId: onWalkerRegistered
      description: On walker registered consumer.
      message: { $ref: '#/components/messages/WalkerRegistered' }
  dogwalking.invite.created:
    description: Published whenever the walker creates an invite for a prospective client.
    publish:
      operationId: onInviteCreated
      description: On invite created consumer.
      message: { $ref: '#/components/messages/InviteCreated' }
  dogwalking.invite.accepted:
    description: >
      Published when a prospective client accepts their invite.
      Carries the inviteId so invite→client lineage is joinable from
      the stream (alongside ClientRegistered on the same transition).
    publish:
      operationId: onInviteAccepted
      description: On invite accepted consumer.
      message: { $ref: '#/components/messages/InviteAccepted' }
  dogwalking.invite.expired:
    description: >
      Published when an invite lazily transitions to expired (first
      accept attempt after expiresAt).
    publish:
      operationId: onInviteExpired
      description: On invite expired consumer.
      message: { $ref: '#/components/messages/InviteExpired' }
  dogwalking.client.registered:
    description: Published whenever a prospective client accepts their invite and the Client record is created.
    publish:
      operationId: onClientRegistered
      description: On client registered consumer.
      message: { $ref: '#/components/messages/ClientRegistered' }
  dogwalking.dog.added:
    description: Published when a dog record is added.
    publish:
      operationId: onDogAdded
      description: On dog added consumer.
      message: { $ref: '#/components/messages/DogAdded' }
  dogwalking.dog.updated:
    description: Published when a dog record is edited.
    publish:
      operationId: onDogUpdated
      description: On dog updated consumer.
      message: { $ref: '#/components/messages/DogUpdated' }
  dogwalking.dogphoto.added:
    description: Published when a photo is added to a dog's profile gallery.
    publish:
      operationId: onDogPhotoAdded
      description: On dog photo added consumer.
      message: { $ref: '#/components/messages/DogPhotoAdded' }
  dogwalking.dogphoto.removed:
    description: Published when a photo is removed from a dog's profile gallery.
    publish:
      operationId: onDogPhotoRemoved
      description: On dog photo removed consumer.
      message: { $ref: '#/components/messages/DogPhotoRemoved' }
  dogwalking.walk.requested:
    description: Published when an owner requests a walk.
    publish:
      operationId: onWalkRequested
      description: On walk requested consumer.
      message: { $ref: '#/components/messages/WalkRequested' }
  dogwalking.walk.scheduled:
    description: Published when a walk is scheduled (walker-created or owner-requested-then-accepted).
    publish:
      operationId: onWalkScheduled
      description: On walk scheduled consumer.
      message: { $ref: '#/components/messages/WalkScheduled' }
  dogwalking.walk.declined:
    description: Published when the walker declines a walk request.
    publish:
      operationId: onWalkDeclined
      description: On walk declined consumer.
      message: { $ref: '#/components/messages/WalkDeclined' }
  dogwalking.walk.cancelled:
    description: Published when a walk is cancelled (by either party).
    publish:
      operationId: onWalkCancelled
      description: On walk cancelled consumer.
      message: { $ref: '#/components/messages/WalkCancelled' }
  dogwalking.walk.completed:
    description: Published when the walker marks a walk completed.
    publish:
      operationId: onWalkCompleted
      description: On walk completed consumer.
      message: { $ref: '#/components/messages/WalkCompleted' }
  dogwalking.walkupdate.posted:
    description: Published whenever a WalkUpdate is posted.
    publish:
      operationId: onWalkUpdatePosted
      description: On walk update posted consumer.
      message: { $ref: '#/components/messages/WalkUpdatePosted' }
  dogwalking.ratecard.updated:
    description: Published when the walker replaces their rate card.
    publish:
      operationId: onRateCardUpdated
      description: On rate card updated consumer.
      message: { $ref: '#/components/messages/RateCardUpdated' }
  dogwalking.invoice.issued:
    description: Published when an invoice is generated.
    publish:
      operationId: onInvoiceIssued
      description: On invoice issued consumer.
      message: { $ref: '#/components/messages/InvoiceIssued' }
  dogwalking.invoice.paid:
    description: Published when an issued invoice is marked paid.
    publish:
      operationId: onInvoicePaid
      description: On invoice paid.
      message: { $ref: '#/components/messages/InvoicePaid' }

components:
  messages:
    UserRegistered:
      name: UserRegistered
      title: User registered
      contentType: application/json
      payload: { $ref: '#/components/schemas/UserRegisteredEnvelope' }
    WalkerRegistered:
      name: WalkerRegistered
      title: Walker registered
