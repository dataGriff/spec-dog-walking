asyncapi: 2.6.0
info:
  title: Dog Walking Domain Events
  version: 1.0.0
  description: |
    Domain event contract for the **Dog Walking** domain. Events are
    emitted on every business-meaningful change: invites created,
    clients registered, dogs added and updated, walks moving through
    their lifecycle, walk updates posted, rate cards updated, invoices
    issued and paid.

    Per SUITE-DESIGN §4.5, every event payload carries the **full
    domain state** of its affected entity at the moment of the event
    (minus [secret]-marked fields). The data contract records that
    state. Together they form the audit-grade historic record —
    downstream consumers can reconstruct what happened from the event
    stream alone, without re-querying the live API.

    All events conform to the [CloudEvents 1.0](https://cloudevents.io/)
    specification. The transport binding for development is declared
    in the `servers` section below; productionised deployments may
    choose any binding compatible with the channel definitions.
  contact:
    name: Dog Walking Domain Spec Set
    url: https://example.com/dogwalking
    email: noreply@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  development:
    url: amqp://localhost:5672
    protocol: amqp
    description: Local AMQP broker (development binding)

defaultContentType: application/json

tags:
  - name: Invites
    description: Invite-lifecycle events.
  - name: Clients
    description: Client-lifecycle events.
  - name: Dogs
    description: Dog-lifecycle events.
  - name: Walks
    description: Walk-lifecycle events.
  - name: WalkUpdates
    description: WalkUpdate-lifecycle events.
  - name: RateCard
    description: RateCard-lifecycle events.
  - name: Invoices
    description: Invoice-lifecycle events.

channels:
  dogwalking.invite.created:
    description: Published whenever the walker creates an invite for a prospective client.
    publish:
      operationId: onInviteCreated
      description: On invite created consumer.
      message: { $ref: '#/components/messages/InviteCreated' }
  dogwalking.client.registered:
    description: Published whenever a prospective client accepts their invite and the Client record is created.
    publish:
      operationId: onClientRegistered
      description: On client registered consumer.
      message: { $ref: '#/components/messages/ClientRegistered' }
  dogwalking.dog.added:
    description: Published when a dog record is added.
    publish:
      operationId: onDogAdded
      description: On dog added consumer.
      message: { $ref: '#/components/messages/DogAdded' }
  dogwalking.dog.updated:
    description: Published when a dog record is edited.
    publish:
      operationId: onDogUpdated
      description: On dog updated consumer.
      message: { $ref: '#/components/messages/DogUpdated' }
  dogwalking.walk.requested:
    description: Published when an owner requests a walk.
    publish:
      operationId: onWalkRequested
      description: On walk requested consumer.
      message: { $ref: '#/components/messages/WalkRequested' }
  dogwalking.walk.scheduled:
    description: Published when a walk is scheduled (walker-created or owner-requested-then-accepted).
    publish:
      operationId: onWalkScheduled
      description: On walk scheduled consumer.
      message: { $ref: '#/components/messages/WalkScheduled' }
  dogwalking.walk.declined:
    description: Published when the walker declines a walk request.
    publish:
      operationId: onWalkDeclined
      description: On walk declined consumer.
      message: { $ref: '#/components/messages/WalkDeclined' }
  dogwalking.walk.cancelled:
    description: Published when a walk is cancelled (by either party).
    publish:
      operationId: onWalkCancelled
      description: On walk cancelled consumer.
      message: { $ref: '#/components/messages/WalkCancelled' }
  dogwalking.walk.completed:
    description: Published when the walker marks a walk completed.
    publish:
      operationId: onWalkCompleted
      description: On walk completed consumer.
      message: { $ref: '#/components/messages/WalkCompleted' }
  dogwalking.walkupdate.posted:
    description: Published whenever a WalkUpdate is posted.
    publish:
      operationId: onWalkUpdatePosted
      description: On walk update posted consumer.
      message: { $ref: '#/components/messages/WalkUpdatePosted' }
  dogwalking.ratecard.updated:
    description: Published when the walker replaces their rate card.
    publish:
      operationId: onRateCardUpdated
      description: On rate card updated consumer.
      message: { $ref: '#/components/messages/RateCardUpdated' }
  dogwalking.invoice.issued:
    description: Published when an invoice is generated.
    publish:
      operationId: onInvoiceIssued
      description: On invoice issued consumer.
      message: { $ref: '#/components/messages/InvoiceIssued' }
  dogwalking.invoice.paid:
    description: Published when an issued invoice is marked paid.
    publish:
      operationId: onInvoicePaid
      description: On invoice paid.
      message: { $ref: '#/components/messages/InvoicePaid' }

components:
  messages:
    InviteCreated:
      name: InviteCreated
      title: Invite created
      contentType: application/json
      payload: { $ref: '#/components/schemas/InviteCreatedEnvelope' }
    ClientRegistered:
      name: ClientRegistered
      title: Client registered
      contentType: application/json
      payload: { $ref: '#/components/schemas/ClientRegisteredEnvelope' }
    DogAdded:
      name: DogAdded
      title: Dog added
      contentType: application/json
      payload: { $ref: '#/components/schemas/DogAddedEnvelope' }
    DogUpdated:
      name: DogUpdated
      title: Dog updated
      contentType: application/json
      payload: { $ref: '#/components/schemas/DogUpdatedEnvelope' }
    WalkRequested:
      name: WalkRequested
      title: Walk requested
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkRequestedEnvelope' }
    WalkScheduled:
      name: WalkScheduled
      title: Walk scheduled
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkScheduledEnvelope' }
    WalkDeclined:
      name: WalkDeclined
      title: Walk declined
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkDeclinedEnvelope' }
    WalkCancelled:
      name: WalkCancelled
      title: Walk cancelled
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkCancelledEnvelope' }
    WalkCompleted:
      name: WalkCompleted
      title: Walk completed
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkCompletedEnvelope' }
    WalkUpdatePosted:
      name: WalkUpdatePosted
      title: Walk update posted
      contentType: application/json
      payload: { $ref: '#/components/schemas/WalkUpdatePostedEnvelope' }
    RateCardUpdated:
      name: RateCardUpdated
      title: Rate card updated
      contentType: application/json
      payload: { $ref: '#/components/schemas/RateCardUpdatedEnvelope' }
    InvoiceIssued:
      name: InvoiceIssued
      title: Invoice issued
      contentType: application/json
      payload: { $ref: '#/components/schemas/InvoiceIssuedEnvelope' }
    InvoicePaid:
      name: InvoicePaid
      title: Invoice paid
      contentType: application/json
      payload: { $ref: '#/components/schemas/InvoicePaidEnvelope' }

  schemas:
    CloudEventsBase:
      type: object
      required: [specversion, type, source, id, time, datacontenttype]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        type: { type: string }
        source: { type: string, format: uri }
        id: { type: string }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }

    Breed:
      type: string
      description: "Closed set of breeds. Mirrors the OpenAPI Breed schema; enforced consistent by ENUM-VALUES-CONSISTENT."
      enum:
        - labrador
        - poodle
        - golden-retriever
        - german-shepherd
        - bulldog
        - beagle
        - dachshund
        - cocker-spaniel
        - border-collie
        - staffordshire-bull-terrier
        - mixed
        - unknown

    InviteCreatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [inviteId, walkerId, email, status, expiresAt, createdAt, updatedAt]
              properties:
                inviteId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                email: { type: string, format: email }
                status: { type: string, enum: [pending, accepted, expired] }
                expiresAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    ClientRegisteredEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [clientId, userId, invitedByWalkerId, displayName, createdAt, updatedAt]
              properties:
                clientId: { type: string, format: uuid }
                userId: { type: string, format: uuid }
                invitedByWalkerId: { type: string, format: uuid }
                displayName: { type: string }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogAddedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [dogId, ownerId, name, createdAt, updatedAt]
              properties:
                dogId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                name: { type: string }
                breed:
                  allOf:
                    - $ref: '#/components/schemas/Breed'
                  nullable: true
                ageYears: { type: integer, nullable: true, minimum: 0 }
                medication: { type: string, nullable: true }
                vetName: { type: string, nullable: true }
                vetPhone: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [dogId, ownerId, name, createdAt, updatedAt]
              properties:
                dogId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                name: { type: string }
                breed:
                  allOf:
                    - $ref: '#/components/schemas/Breed'
                  nullable: true
                ageYears: { type: integer, nullable: true, minimum: 0 }
                medication: { type: string, nullable: true }
                vetName: { type: string, nullable: true }
                vetPhone: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, createdAt, updatedAt]
              properties:
                walkId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                walkType: { type: string }
                durationMinutes: { type: integer }
                startAt: { type: string, format: date-time }
                requesterRole: { type: string, enum: [walker, owner] }
                notes: { type: string, nullable: true }
                status: { type: string, enum: [requested, scheduled, declined, cancelled, completed] }
                declinedReason: { type: string, nullable: true }
                cancelledByRole: { type: string, nullable: true, enum: [walker, owner] }
                completedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkScheduledEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, createdAt, updatedAt]
              properties:
                walkId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                walkType: { type: string }
                durationMinutes: { type: integer }
                startAt: { type: string, format: date-time }
                requesterRole: { type: string, enum: [walker, owner] }
                notes: { type: string, nullable: true }
                status: { type: string, enum: [requested, scheduled, declined, cancelled, completed] }
                declinedReason: { type: string, nullable: true }
                cancelledByRole: { type: string, nullable: true, enum: [walker, owner] }
                completedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkDeclinedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, declinedReason, createdAt, updatedAt]
              properties:
                walkId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                walkType: { type: string }
                durationMinutes: { type: integer }
                startAt: { type: string, format: date-time }
                requesterRole: { type: string, enum: [walker, owner] }
                notes: { type: string, nullable: true }
                status: { type: string, enum: [requested, scheduled, declined, cancelled, completed] }
                declinedReason: { type: string }
                cancelledByRole: { type: string, nullable: true, enum: [walker, owner] }
                completedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkCancelledEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, cancelledByRole, createdAt, updatedAt]
              properties:
                walkId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                walkType: { type: string }
                durationMinutes: { type: integer }
                startAt: { type: string, format: date-time }
                requesterRole: { type: string, enum: [walker, owner] }
                notes: { type: string, nullable: true }
                status: { type: string, enum: [requested, scheduled, declined, cancelled, completed] }
                declinedReason: { type: string, nullable: true }
                cancelledByRole: { type: string, enum: [walker, owner] }
                completedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkCompletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, completedAt, createdAt, updatedAt]
              properties:
                walkId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                walkType: { type: string }
                durationMinutes: { type: integer }
                startAt: { type: string, format: date-time }
                requesterRole: { type: string, enum: [walker, owner] }
                notes: { type: string, nullable: true }
                status: { type: string, enum: [requested, scheduled, declined, cancelled, completed] }
                declinedReason: { type: string, nullable: true }
                cancelledByRole: { type: string, nullable: true, enum: [walker, owner] }
                completedAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkUpdatePostedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [walkUpdateId, walkId, createdAt, updatedAt]
              properties:
                walkUpdateId: { type: string, format: uuid }
                walkId: { type: string, format: uuid }
                notes: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    RateCardEntryPayload:
      type: object
      required: [id, rateCardId, walkType, durationMinutes, priceCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        rateCardId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceLineItemPayload:
      type: object
      required: [id, invoiceId, walkId, walkType, durationMinutes, priceCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        walkId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RateCardUpdatedEnvelope:
      description: |
        Carries the RateCard root state plus the contained
        RateCardEntry rows (per `## Aggregates` in domain-model.md
        and SUITE-DESIGN §4.5).
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [rateCardId, walkerId, currency, createdAt, updatedAt, entries]
              properties:
                rateCardId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                currency: { type: string, minLength: 3, maxLength: 3 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                entries:
                  type: array
                  items: { $ref: '#/components/schemas/RateCardEntryPayload' }
    InvoiceIssuedEnvelope:
      description: |
        Carries the Invoice root state plus the contained
        InvoiceLineItem rows (per `## Aggregates` in domain-model.md
        and SUITE-DESIGN §4.5).
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [invoiceId, walkerId, clientId, periodStart, periodEnd, currency, totalCents, status, tipCents, createdAt, updatedAt, lineItems]
              properties:
                invoiceId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                clientId: { type: string, format: uuid }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                currency: { type: string, minLength: 3, maxLength: 3 }
                totalCents: { type: integer, minimum: 0 }
                status: { type: string, enum: [issued, paid] }
                paidAt: { type: string, format: date-time, nullable: true }
                paidVia: { type: string, nullable: true }
                tipCents: { type: integer, minimum: 0, default: 0 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                lineItems:
                  type: array
                  items: { $ref: '#/components/schemas/InvoiceLineItemPayload' }
    InvoicePaidEnvelope:
      description: |
        Carries the Invoice root state at the mark-paid transition
        plus the contained InvoiceLineItem rows (per `## Aggregates`
        — InvoicePaid is also an event on the Invoice aggregate
        root, so it must carry the same children as InvoiceIssued).
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          properties:
            data:
              type: object
              required: [invoiceId, walkerId, clientId, periodStart, periodEnd, currency, totalCents, status, paidAt, paidVia, tipCents, createdAt, updatedAt, lineItems]
              properties:
                invoiceId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                clientId: { type: string, format: uuid }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                currency: { type: string, minLength: 3, maxLength: 3 }
                totalCents: { type: integer, minimum: 0 }
                status: { type: string, enum: [issued, paid] }
                paidAt: { type: string, format: date-time }
                paidVia: { type: string }
                tipCents: { type: integer, minimum: 0 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                lineItems:
                  type: array
                  items: { $ref: '#/components/schemas/InvoiceLineItemPayload' }
