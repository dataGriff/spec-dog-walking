    Role:
      type: string
      description: "Closed enum (mirrors openapi)."
      enum: [walker, owner]
    # WalkStatus / InvoiceStatus / InviteStatus are not declared here:
    # each lifecycle channel pins its payload's `status` to the single
    # legal value for that transition (single-value enum), so a
    # walk.requested event can never claim `status: completed`.

    PhotoContentType:
      type: string
      description: "Permitted MIME types for walk-update photos (mirrors openapi)."
      enum: [image/jpeg, image/png, image/heic]

    UserRegisteredEnvelope:
      description: |
        Full User state minus [secret] fields (no password hash).
        Published on walker self-registration and on invite
        acceptance — every userId in the stream resolves to one of
        these.
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [userId, email, role, createdAt, updatedAt]
              properties:
                userId: { type: string, format: uuid }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    WalkerRegisteredEnvelope:
      description: |
        Full Walker state. Published once per instance (single-walker
        constraint) — resolves every walkerId FK in the stream.
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [walkerId, userId, displayName, createdAt, updatedAt]
              properties:
                walkerId: { type: string, format: uuid }
                userId: { type: string, format: uuid }
                displayName: { type: string }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    InviteAcceptedEnvelope:
      description: |
        Full Invite state at acceptance (minus the [secret] token).
        Emitted alongside ClientRegistered and UserRegistered on the
        same transition; the shared inviteId joins the three.
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [inviteId, walkerId, email, status, expiresAt, createdAt, updatedAt]
              properties:
                inviteId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                email: { type: string, format: email }
                status: { type: string, enum: [accepted] }
                expiresAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    InviteExpiredEnvelope:
      description: |
        Minimal removal-shaped payload (the invite is dead surface
        after expiry; no PII carried).
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [inviteId, status, expiresAt, updatedAt]
              properties:
                inviteId: { type: string, format: uuid }
                status: { type: string, enum: [expired] }
                expiresAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    InviteCreatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [inviteId, walkerId, email, status, expiresAt, createdAt, updatedAt]
              properties:
                inviteId: { type: string, format: uuid }
                walkerId: { type: string, format: uuid }
                email: { type: string, format: email }
                status: { type: string, enum: [pending] }
                expiresAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    ClientRegisteredEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [clientId, inviteId, userId, invitedByWalkerId, displayName, createdAt, updatedAt]
              properties:
                clientId: { type: string, format: uuid }
                inviteId: { type: string, format: uuid, description: 'Lineage join key to the invite that created this client.' }
                userId: { type: string, format: uuid }
                invitedByWalkerId: { type: string, format: uuid }
                displayName: { type: string }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogAddedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [dogId, ownerId, name, photos, createdAt, updatedAt]
              properties:
                dogId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                name: { type: string }
                breed:
                  allOf:
                    - $ref: '#/components/schemas/Breed'
                  nullable: true
                ageYears: { type: integer, nullable: true, minimum: 0 }
                medication: { type: string, nullable: true }
                vetName: { type: string, nullable: true }
                vetPhone: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                photos:
                  type: array
                  maxItems: 5
                  items: { $ref: '#/components/schemas/DogPhotoPayload' }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [dogId, ownerId, name, photos, createdAt, updatedAt]
              properties:
                dogId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                name: { type: string }
                breed:
                  allOf:
                    - $ref: '#/components/schemas/Breed'
                  nullable: true
                ageYears: { type: integer, nullable: true, minimum: 0 }
                medication: { type: string, nullable: true }
                vetName: { type: string, nullable: true }
                vetPhone: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                photos:
                  type: array
                  maxItems: 5
                  items: { $ref: '#/components/schemas/DogPhotoPayload' }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogPhotoPayload:
      type: object
      required: [id, dogId, contentType, sizeBytes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dogId: { type: string, format: uuid }
        contentType: { $ref: '#/components/schemas/PhotoContentType' }
        sizeBytes: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DogPhotoAddedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [dogPhotoId, dogId, contentType, sizeBytes, createdAt, updatedAt]
              properties:
                dogPhotoId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                contentType: { $ref: '#/components/schemas/PhotoContentType' }
                sizeBytes: { type: integer, minimum: 0 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
    DogPhotoRemovedEnvelope:
      description: |
        Removal event — minimal payload by convention (removal
        channels are exempt from the full-state rule).
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [dogPhotoId, dogId, removedAt]
              properties:
                dogPhotoId: { type: string, format: uuid }
                dogId: { type: string, format: uuid }
                removedAt: { type: string, format: date-time }
    WalkRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/CloudEventsBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [walkId, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, createdAt, updatedAt]
