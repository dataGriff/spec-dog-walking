openapi: 3.0.3
info:
  title: Dog Walking API
  description: |
    REST contract for the **Dog Walking** domain — a single-walker
    business that manages clients, dogs, walks, updates, rate cards,
    and invoices. See `prd.md` for the domain narrative,
    `domain-model.md` for entity definitions, and `auth-matrix.md`
    for the operation × role permission matrix.
  version: 1.0.0
  contact:
    name: Dog Walking Domain Spec Set
    email: noreply@example.com

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: Authentication — register, login, password reset, invite acceptance
  - name: Clients
    description: Walker-managed list of clients (invited via email)
  - name: Dogs
    description: Owner-and-walker editable dog records
  - name: Walks
    description: Walk lifecycle — request, schedule, complete, cancel
  - name: WalkUpdates
    description: Notes and photos posted against walks
  - name: Invoices
    description: Walker-generated invoices for completed walks
  - name: RateCard
    description: Walker's per-(walkType,duration) pricing table

security:
  - BearerAuth: []

paths:
  # ── Auth ───────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerWalker
      summary: Walker self-registers
      description: Walker self-registers.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registration succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email or walker conflict, or Idempotency-Key reuse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      description: Log in.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a fresh token pair
      description: >
        Rotates the presented refresh token — the old token is retired
        and a new access + refresh pair issued (US-021). Public: the
        refresh token in the body is the credential, so an expired
        access token never blocks the exchange. Expired, revoked,
        rotated, and never-existed tokens are indistinguishable
        (`INVALID_REFRESH_TOKEN`).
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Fresh token pair issued; presented token rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the presented refresh token
      description: >
        Revokes the presented refresh token so the device's session
        cannot be silently renewed (US-022). Requires a valid bearer
        token; the refresh token to revoke travels in the body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Refresh token revoked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: Request a password reset email.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Always returned (enumeration defense) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Confirm a password reset with a token
      description: Confirm a password reset with a token.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '200': { description: Password updated; refresh tokens revoked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: Token never existed (expired/used tokens return 410)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/invites/{token}/accept:
    post:
      tags: [Auth]
      operationId: acceptInvite
      summary: Accept a client invite and set password
      description: Accept a client invite and set password.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAcceptRequest' }
      responses:
        '200':
          description: Invite accepted; tokens returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: Token never existed (expired/used tokens return 410)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email already registered, or Idempotency-Key reuse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ── Clients ───────────────────────────────────────────────────
  /v1/clients:
    post:
      tags: [Clients]
      operationId: addClient
      summary: Walker invites a new client
      description: >
        Walker issues an invite to a prospective client. The Client
        record itself is created when the invite is accepted (Decision
        Log: CLIENT-CREATED-AT-ACCEPTANCE), so this returns the Invite,
        not a Client. Walker-only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreateRequest' }
      responses:
        '201':
          description: Invite created and email queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already registered, or Idempotency-Key reuse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Clients]
      operationId: listClients
      summary: Walker lists their clients
      description: >
        Walker lists the clients who have accepted their invites.
        Walker-only — owners have no client list.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of clients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Dogs ──────────────────────────────────────────────────────
  /v1/dogs:
    post:
      tags: [Dogs]
      operationId: addDog
      summary: Add dog
      description: >
        Owner adds their own dog (ownerId inferred), or the walker adds
        one for a client via `ownerId`. An unknown or non-client
        `ownerId` returns 404 — indistinguishable from nonexistent
        (Decision Log: TENANCY-404-FOR-BOTH).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogCreateRequest' }
      responses:
        '201':
          description: Dog created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Dogs]
      operationId: listDogs
      summary: List dogs
      description: >
        Owners see only their own dogs; the walker sees all dogs
        belonging to their clients.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of dogs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DogList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/dogs/{dogId}:
    parameters:
      - { name: dogId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Dogs]
      operationId: viewDog
      summary: View dog
      description: >
        Full dog record. Visible to the dog's owner and their walker
        only; a dog outside the caller's tenancy returns 404,
        indistinguishable from nonexistent.
      responses:
        '200':
          description: Dog detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Dogs]
      operationId: editDog
      summary: Edit dog
      description: >
        Editable by the dog's owner and their walker. A dog outside
        the caller's tenancy returns 404, indistinguishable from
        nonexistent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogPatchRequest' }
      responses:
        '200':
          description: Dog updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Walks ─────────────────────────────────────────────────────
  /v1/walks:
    post:
      tags: [Walks]
      operationId: scheduleWalk
      summary: Schedule walk
      description: >
        Owner-created walks start `requested` with a null price;
        walker-created walks start `scheduled` and record `priceCents`
        from the matching rate-card entry immediately. An unknown or
        out-of-tenancy `dogId` returns 404.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkCreateRequest' }
      responses:
        '201':
          description: Walk created (requested if owner, scheduled if walker)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Walks]
      operationId: listWalks
      summary: List walks
      description: >
        Owners see only their own dogs' walks; the walker sees all
        walks for their clients (PRD US-010).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [requested, scheduled, declined, cancelled, completed] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated list of walks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/walks/{walkId}/decision:
    parameters:
      - { name: walkId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Walks]
      operationId: decideWalk
      summary: Decide walk
      description: Decide walk.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkDecisionRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/walks/{walkId}/cancel:
    parameters:
      - { name: walkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Walks]
      operationId: cancelWalk
      summary: Cancel walk
      description: >
        Owner withdraws a `requested` walk or either party cancels a
        `scheduled` one. A walker cancelling a `requested` walk gets
        403 — decline via the decision endpoint is the walker's route
        out of `requested`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Walk cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/walks/{walkId}/complete:
    parameters:
      - { name: walkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Walks]
      operationId: completeWalk
      summary: Complete walk
      description: Complete walk.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Walk completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── WalkUpdates ───────────────────────────────────────────────
  /v1/walks/{walkId}/updates:
    parameters:
      - { name: walkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [WalkUpdates]
      operationId: postWalkUpdate
      summary: Post walk update
      description: >
        Walker-only. Allowed while the walk is `scheduled` (live) or
        `completed` (post-hoc). Requires notes or at least one photo.
        Rejected with 409 `STORAGE_QUOTA_EXCEEDED` when the instance's
        photo-storage cap (NFR-DATA-003) is exhausted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/WalkUpdateCreateRequest' }
      responses:
        '201':
          description: Update posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkUpdate' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [WalkUpdates]
      operationId: listWalkUpdates
      summary: List walk updates
      description: >
        Updates in posted-at order, visible to the walk's owner and
        walker only (out-of-tenancy walks return 404). Deliberately
        unpaginated — the per-walk timeline is bounded and only
        meaningful whole (NFR-PERF-006).
      responses:
        '200':
          description: Walk updates in posted-at order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalkUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/walk-updates/{updateId}/photos/{photoId}:
    parameters:
      - { name: updateId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [WalkUpdates]
      operationId: getWalkUpdatePhoto
      summary: Get walk update photo
      description: >
        Streams the photo bytes over the authenticated endpoint (never
        a public URL). Visible to the walk's owner and walker only;
        out-of-tenancy photos return 404.
      responses:
        '200':
          description: Photo bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/heic: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Invoices ──────────────────────────────────────────────────
  /v1/invoices:
    post:
      tags: [Invoices]
      operationId: generateInvoice
      summary: Generate invoice
      description: >
        Walker-only. Line items cover every completed walk in the
        period, priced from each walk's recorded `priceCents`
        (snapshotted at its `scheduled` transition — later rate-card
        changes never reprice). An unknown or non-client `clientId`
        returns 404.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreateRequest' }
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices
      description: >
        Walkers see all their issued invoices; owners see only
        invoices addressed to them (PRD US-015). `from`/`to` filter on
        the issue date; `balanceOwedCents` in the response sums
        `totalCents` over `issued` invoices across the whole filtered
        set, giving the running balance owed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [issued, paid] } }
        - { name: from, in: query, description: 'Inclusive lower bound on the invoice issue date', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Inclusive upper bound on the invoice issue date', schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated list of invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/invoices/{invoiceId}/mark-paid:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Invoices]
      operationId: markInvoicePaid
      summary: Mark invoice paid
      description: Mark invoice paid.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceMarkPaidRequest' }
      responses:
        '200':
          description: Invoice marked paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Rate card ─────────────────────────────────────────────────
  /v1/rate-card:
    put:
      tags: [RateCard]
      operationId: setRateCard
      summary: Set rate card
      description: >
        Walker-only. Replaces the full entry table. Currency is
        card-level and immutable once established — a differing
        currency returns 409 `CURRENCY_IMMUTABLE` (Decision Log:
        CURRENCY-CARD-LEVEL). Changes apply prospectively; walks keep
        the `priceCents` they recorded at scheduling.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateCardPutRequest' }
      responses:
        '200':
          description: Rate card updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [RateCard]
      operationId: viewRateCard
      summary: View rate card
      description: >
        Singleton — always resolves to the instance's single walker's
        card. Owners may view it (being a client of this walker is
        what admitted them). Returns 404 before the first PUT.
      responses:
        '200':
          description: Walker's rate card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated UUID per intent. Lets the server replay the
        original response on retry — without it, retried POSTs
        produce duplicates. See SUITE-DESIGN §4.6 "Idempotent
        Mutating Ops" and error-catalogue.md `IDEMPOTENCY_KEY_CONFLICT`.
        Server-side replay store TTL is 24h.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Caller lacks the required role or ownership
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        Resource is in a state that disallows the operation, or the
        Idempotency-Key was reused with a different request body
        (`IDEMPOTENCY_KEY_CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Token has expired or been used
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Request rate exceeded the NFR-SEC-004 threshold
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request body or query failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }

  schemas:
    # ── Error envelopes ────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - TOKEN_EXPIRED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - RESOURCE_NOT_FOUND
            - EMAIL_ALREADY_REGISTERED
            - WALKER_ALREADY_EXISTS
            - WALK_NOT_PENDING
            - WALK_NOT_CANCELLABLE
            - WALK_NOT_SCHEDULED
            - WALK_UPDATE_NOT_ALLOWED
            - INVOICE_NOT_ISSUED
            - INVITE_EXPIRED
            - INVITE_ALREADY_USED
            - RESET_TOKEN_EXPIRED
            - RESET_TOKEN_ALREADY_USED
            - INVALID_REFRESH_TOKEN
            - IDEMPOTENCY_KEY_CONFLICT
            - CURRENCY_IMMUTABLE
            - STORAGE_QUOTA_EXCEEDED
            - RATE_LIMITED
        message:
          type: string
    ValidationError:
      type: object
      required: [code, message]
      description: >
        400-level envelope. `details[]` carries per-field diagnostics
        for `VALIDATION_ERROR`; the domain-specific 400 codes
        (`INVALID_WALK_TYPE`, `INVALID_PHOTO`, `NO_BILLABLE_WALKS`)
        use `message` alone.
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_WALK_TYPE
            - INVALID_PHOTO
            - NO_BILLABLE_WALKS
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    # ── Auth ───────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }
    InviteAcceptRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/UserSummary' }

    # ── Entities ───────────────────────────────────────────────
    User:
      type: object
      description: >
        The authentication record behind every login. Secrets
        (password hash) are deliberately absent — they never cross
        the API boundary.
      required: [id, email, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    Walker:
      type: object
      required: [id, userId, displayName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Client:
      type: object
      required: [id, userId, invitedByWalkerId, displayName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        invitedByWalkerId: { type: string, format: uuid }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientCreateRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    ClientList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Invite:
      type: object
      description: >
        Returned by addClient. The single-use `token` is deliberately
        absent — it travels only in the invite email.
      required: [id, walkerId, email, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walkerId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/InviteStatus' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Role:
      type: string
      description: "User role. Closed enum — `walker` (single walker per domain instance) and `owner` (dog owners / clients)."
      enum: [walker, owner]
    WalkStatus:
      type: string
      description: "Lifecycle state of a Walk. Closed enum. Transitions are governed by the Walk Status Lifecycle in domain-model.md."
      enum: [requested, scheduled, declined, cancelled, completed]
    InvoiceStatus:
      type: string
      description: "Lifecycle state of an Invoice. Closed enum."
      enum: [issued, paid]
    InviteStatus:
      type: string
      description: "Lifecycle state of a client Invite. Closed enum."
      enum: [pending, accepted, expired]
    PhotoContentType:
      type: string
      description: "Permitted MIME types for walk-update photos. Closed enum."
      enum: [image/jpeg, image/png, image/heic]
    Breed:
      type: string
      description: |
        Authoritative list of dog breeds the API recognises. Sourced
        from the UK Kennel Club's recognised-breeds list across the
        seven groups (Hound, Working, Terrier, Toy, Utility, Gundog,
        Pastoral), with `mixed` and `unknown` fallbacks so the field
        is always answerable. This is an **open enum** (per the
