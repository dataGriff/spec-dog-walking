    Dog:
      type: object
      required: [id, ownerId, name, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        breed:
          allOf:
            - $ref: '#/components/schemas/Breed'
          nullable: true
        ageYears: { type: integer, nullable: true, minimum: 0 }
        medication: { type: string, nullable: true }
        vetName: { type: string, nullable: true }
        vetPhone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DogCreateRequest:
      type: object
      required: [name]
      properties:
        ownerId: { type: string, format: uuid, description: "Required when caller is walker; ignored otherwise." }
        name: { type: string, minLength: 1 }
        breed:
          $ref: '#/components/schemas/Breed'
        ageYears: { type: integer, minimum: 0 }
        medication: { type: string }
        vetName: { type: string }
        vetPhone: { type: string }
        notes: { type: string }
    DogPatchRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        breed:
          allOf:
            - $ref: '#/components/schemas/Breed'
          nullable: true
        ageYears: { type: integer, nullable: true, minimum: 0 }
        medication: { type: string, nullable: true }
        vetName: { type: string, nullable: true }
        vetPhone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    DogList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Dog' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Walk:
      type: object
      required: [id, dogId, walkerId, walkType, durationMinutes, startAt, requesterRole, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dogId: { type: string, format: uuid }
        walkerId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        requesterRole: { $ref: '#/components/schemas/Role' }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WalkStatus' }
        declinedReason: { type: string, nullable: true }
        cancelledByRole:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WalkCreateRequest:
      type: object
      required: [dogId, walkType, durationMinutes, startAt]
      properties:
        dogId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        notes: { type: string }
    WalkDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [scheduled, declined] }
        reason: { type: string }
    WalkList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Walk' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    WalkUpdate:
      type: object
      required: [id, walkId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walkId: { type: string, format: uuid }
        notes: { type: string, nullable: true }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WalkUpdateCreateRequest:
      type: object
      properties:
        notes: { type: string }
        photo:
          type: array
          items: { type: string, format: binary }
          maxItems: 5

    Photo:
      type: object
      required: [id, walkUpdateId, contentType, sizeBytes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walkUpdateId: { type: string, format: uuid }
        contentType: { $ref: '#/components/schemas/PhotoContentType' }
        sizeBytes: { type: integer, minimum: 0 }
        capturedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RateCard:
      type: object
      required: [id, walkerId, currency, entries, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walkerId: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/RateCardEntry' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RateCardEntry:
      type: object
      required: [id, rateCardId, walkType, durationMinutes, priceCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        rateCardId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RateCardPutRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [walkType, durationMinutes, priceCents, currency]
            properties:
              walkType: { type: string }
              durationMinutes: { type: integer, minimum: 1 }
              priceCents: { type: integer, minimum: 1 }
              currency: { type: string, minLength: 3, maxLength: 3 }

    Invoice:
      type: object
      required: [id, walkerId, clientId, periodStart, periodEnd, currency, totalCents, status, tipCents, lineItems, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        walkerId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalCents: { type: integer, minimum: 0 }
        tipCents: { type: integer, minimum: 0, default: 0 }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        paidAt: { type: string, format: date-time, nullable: true }
        paidVia: { type: string, nullable: true }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLineItem' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceCreateRequest:
      type: object
      required: [clientId, periodStart, periodEnd]
      properties:
        clientId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
    InvoiceMarkPaidRequest:
      type: object
      required: [paidAt, paidVia]
      properties:
        paidAt: { type: string, format: date-time }
        paidVia: { type: string }
        tipCents: { type: integer, minimum: 0, default: 0 }
    InvoiceList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    InvoiceLineItem:
      type: object
      required: [id, invoiceId, walkId, walkType, durationMinutes, priceCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        walkId: { type: string, format: uuid }
        walkType: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1, description: "Always strictly positive — copied from a RateCardEntry which enforces the same constraint." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
