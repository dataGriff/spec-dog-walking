apiVersion: v3.1.0
kind: DataContract
id: urn:datacontract:dogwalking:dogwalking-domain-events:1.0.0
name: Dog Walking Data Contract
version: 1.0.0
status: active
domain: dogwalking

description:
  purpose: >
    Defines the structure and quality expectations for data published
    by the Dog Walking domain via domain events. This contract is the
    authoritative historical integration point for downstream
    consumers (reporting, analytics, downstream sync). Per
    SUITE-DESIGN §4.5 every record carries the full state of its
    affected entity at the moment of the event — the contract is the
    audit-grade historic record.
  usage: >
    Consume this contract to understand the schema of records emitted
    on the `dogwalking.*` event channels. Use it as the basis for
    pipelines, analytics, and reporting on the walker's business.
  limitations: >
    Covers the event payload only (data envelope). CloudEvents
    metadata fields (specversion, type, source, id, time,
    datacontenttype) are documented in `asyncapi.yaml` and not
    repeated here.

team:
  name: Dog Walking Domain Spec Set
  members:
    - username: dogwalking-domain
      name: Dog Walking Domain Spec Set
      role: owner

servers:
  - server: development
    type: custom
    description: Local AMQP broker (development binding) publishing dogwalking domain events.
    environment: dev
    customProperties:
      - property: protocol
        value: amqp
      - property: url
        value: amqp://localhost:5672

schema:
  - name: invite
    description: >
      Invite records published via the dogwalking.invite.created
      channel. Represents the invite issued by the walker for a
      prospective client. The opaque `token` field is intentionally
      excluded (marked `[secret]` in the domain model).
    physicalType: topic
    properties:
      - { name: inviteId, description: Invite identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: walkerId, description: Walker who issued the invite., logicalType: string, physicalType: uuid, required: true }
      - { name: email, description: Prospective client's email., logicalType: string, required: true }
      - { name: status, description: Invite status at emission (pending / accepted / expired)., logicalType: string, required: true }
      - { name: expiresAt, description: Timestamp at which the invite auto-transitions to expired., logicalType: timestamp, required: true }
      - { name: createdAt, description: When the invite was queued., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }

  - name: client
    description: >
      Client records published via the dogwalking.client.registered
      channel. Represents the walker-managed client record at the
      point of registration.
    physicalType: topic
    properties:
      - { name: clientId, description: Client identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: userId, description: User identifier (role=owner) backing the client., logicalType: string, physicalType: uuid, required: true }
      - { name: invitedByWalkerId, description: Walker who issued the invite that created this client., logicalType: string, physicalType: uuid, required: true }
      - { name: displayName, description: Name the walker uses to refer to this client., logicalType: string, required: true }
      - { name: createdAt, description: When the Client record was created., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }

  - name: dog
    description: >
      Dog records published via dogwalking.dog.added and
      dogwalking.dog.updated channels. Each event carries the full
      Dog state at the moment of emission.
    physicalType: topic
    properties:
      - { name: dogId, description: Dog identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: ownerId, description: Client (owner) identifier., logicalType: string, physicalType: uuid, required: true }
      - { name: name, description: Dog's name., logicalType: string, required: true }
      - { name: breed, description: Closed-set breed (see Breed enum in openapi/asyncapi). Null when unknown., logicalType: string, required: false }
      - { name: ageYears, description: Age in whole years., logicalType: integer, required: false }
      - { name: medication, description: Free-text medication notes., logicalType: string, required: false }
      - { name: vetName, description: Vet practice name., logicalType: string, required: false }
      - { name: vetPhone, description: Vet contact number., logicalType: string, required: false }
      - { name: notes, description: Free-text quirks / handling notes., logicalType: string, required: false }
      - { name: createdAt, description: Creation timestamp., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }

  - name: walk
    description: >
      Walk records published across the full walk lifecycle:
      dogwalking.walk.requested / scheduled / declined / cancelled /
      completed. Every event carries the full Walk state at the
      moment of emission; the `status` field distinguishes which
      lifecycle event was published.
    physicalType: topic
    properties:
      - { name: walkId, description: Walk identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: dogId, description: Dog being walked., logicalType: string, physicalType: uuid, required: true }
      - { name: walkerId, description: Walker assigned to the walk., logicalType: string, physicalType: uuid, required: true }
      - { name: walkType, description: Walk type matching the rate card., logicalType: string, required: true }
      - { name: durationMinutes, description: Walk duration in minutes., logicalType: integer, required: true }
      - { name: startAt, description: Scheduled start timestamp., logicalType: timestamp, required: true }
      - { name: requesterRole, description: Who created the walk (walker / owner)., logicalType: string, required: true }
      - { name: notes, description: Free-text booking notes., logicalType: string, required: false }
      - { name: status, description: Walk status at emission (requested / scheduled / declined / cancelled / completed)., logicalType: string, required: true }
      - { name: declinedReason, description: Walker's decline reason (when status=declined)., logicalType: string, required: false }
      - { name: cancelledByRole, description: Who cancelled the walk (when status=cancelled)., logicalType: string, required: false }
      - { name: completedAt, description: Completion timestamp (when status=completed)., logicalType: timestamp, required: false }
      - { name: createdAt, description: When the walk was first recorded., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }

  - name: walkupdate
    description: >
      WalkUpdate records published via the
      dogwalking.walkupdate.posted channel. Carries the WalkUpdate
      root plus its contained Photo rows (per `## Aggregates` in
      domain-model.md).
    physicalType: topic
    properties:
      - { name: walkUpdateId, description: WalkUpdate identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: walkId, description: Parent walk identifier., logicalType: string, physicalType: uuid, required: true }
      - { name: notes, description: Free-text note attached to the update., logicalType: string, required: false }
      - { name: createdAt, description: When the update was posted., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }
      - name: photos
        description: Photos attached to this walk update at the moment of the event.
        logicalType: array
        required: true
        items:
          logicalType: object
          properties:
            - { name: id, description: Photo identifier., logicalType: string, physicalType: uuid, required: true }
            - { name: walkUpdateId, description: FK to parent WalkUpdate., logicalType: string, physicalType: uuid, required: true }
            - { name: contentType, description: MIME type (image/jpeg, image/png, image/heic)., logicalType: string, required: true }
            - { name: sizeBytes, description: Stored size in bytes., logicalType: integer, required: true }
            - { name: capturedAt, description: Capture time from EXIF, if present., logicalType: timestamp, required: false }
            - { name: createdAt, description: When the photo was uploaded., logicalType: timestamp, required: true }
            - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }

  - name: ratecard
    description: >
      RateCard root records published via the
      dogwalking.ratecard.updated channel. Carries the rate-card
      root plus its contained RateCardEntry rows (per
      `## Aggregates` in domain-model.md).
    physicalType: topic
    properties:
      - { name: rateCardId, description: RateCard identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: walkerId, description: Walker whose rate card changed., logicalType: string, physicalType: uuid, required: true }
      - { name: currency, description: ISO 4217 currency code., logicalType: string, required: true }
      - { name: createdAt, description: Creation timestamp., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }
      - name: entries
        description: Rate-card entries on this rate card at the moment of the event.
        logicalType: array
        required: true
        items:
          logicalType: object
          properties:
            - { name: id, description: RateCardEntry identifier., logicalType: string, physicalType: uuid, required: true }
            - { name: rateCardId, description: FK to parent RateCard., logicalType: string, physicalType: uuid, required: true }
            - { name: walkType, description: Walk type for this entry (e.g. solo, group)., logicalType: string, required: true }
            - { name: durationMinutes, description: Duration of the walk in minutes., logicalType: integer, required: true }
            - { name: priceCents, description: Price for this entry in the rate card's currency, minor units., logicalType: integer, required: true }
            - { name: createdAt, description: Entry creation timestamp., logicalType: timestamp, required: true }
            - { name: updatedAt, description: Entry last update timestamp., logicalType: timestamp, required: true }

  - name: invoice
    description: >
      Invoice root records published via dogwalking.invoice.issued
      and dogwalking.invoice.paid channels. Carries the invoice
      root plus its contained InvoiceLineItem rows (per
      `## Aggregates` in domain-model.md).
    physicalType: topic
    properties:
      - { name: invoiceId, description: Invoice identifier., logicalType: string, physicalType: uuid, required: true, unique: true, primaryKey: true, primaryKeyPosition: 1 }
      - { name: walkerId, description: Walker issuing the invoice., logicalType: string, physicalType: uuid, required: true }
      - { name: clientId, description: Client being billed., logicalType: string, physicalType: uuid, required: true }
      - { name: periodStart, description: Billing period start date., logicalType: date, required: true }
      - { name: periodEnd, description: Billing period end date., logicalType: date, required: true }
      - { name: currency, description: ISO 4217 currency code copied from the RateCard at issue., logicalType: string, required: true }
      - { name: totalCents, description: Total amount in minor units (sum of line-item priceCents)., logicalType: integer, required: true }
      - { name: status, description: Invoice status at emission (issued / paid)., logicalType: string, required: true }
      - { name: paidAt, description: Payment timestamp (when status=paid)., logicalType: timestamp, required: false }
      - { name: paidVia, description: Payment channel description (when status=paid)., logicalType: string, required: false }
      - { name: tipCents, description: Tip amount in minor units (defaults to 0 at issue)., logicalType: integer, required: true }
      - { name: createdAt, description: Issue timestamp., logicalType: timestamp, required: true }
      - { name: updatedAt, description: Last update timestamp., logicalType: timestamp, required: true }
      - name: lineItems
        description: Invoice line items billing each completed walk in the period.
        logicalType: array
        required: true
        items:
          logicalType: object
          properties:
            - { name: id, description: InvoiceLineItem identifier., logicalType: string, physicalType: uuid, required: true }
            - { name: invoiceId, description: FK to parent Invoice., logicalType: string, physicalType: uuid, required: true }
            - { name: walkId, description: FK to the completed Walk this line bills., logicalType: string, physicalType: uuid, required: true }
            - { name: walkType, description: Walk type copied from the Walk at issue., logicalType: string, required: true }
            - { name: durationMinutes, description: Duration of the walk in minutes., logicalType: integer, required: true }
            - { name: priceCents, description: Price in the invoice currency, minor units, from the rate-card entry in force at the Walk's scheduled transition., logicalType: integer, required: true }
            - { name: createdAt, description: Line item creation timestamp., logicalType: timestamp, required: true }
            - { name: updatedAt, description: Line item last update timestamp., logicalType: timestamp, required: true }

slaProperties:
  - property: availability
    value: "99.5"
    unit: "%"
    description: Events are delivered at least 99.5% of the time (matches NFR-AVAIL-002).
  - property: retention
    value: 30
    unit: d
    description: Events are retained for 30 days for replay and historical access.
