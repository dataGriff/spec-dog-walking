name: Audit

# Tier 3 of the suite's tiered audit approach (SUITE-DESIGN.md §9).
# Runs the full Phase 7 conformance audit on every PR and on pushes to
# main. Blocks merge if the audit fails.
#
# Tier 1 (pre-commit) and Tier 2 (pre-push) catch the cheap and medium
# checks locally. This workflow is the heavy authoritative gate.
#
# CI mirrors the local developer layout exactly: the suite is cloned
# as a sibling of the spec repo, tools come from .mise.toml, and every
# step goes through the same Taskfile targets the hooks and agents use
# (no CI-only command paths).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Phase 7 conformance audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec-dog-walking
    steps:
      - uses: actions/checkout@v4
        with:
          path: spec-dog-walking

      # The Taskfile resolves the suite via DOMAIN_SPEC_SUITE_ROOT or
      # the sibling ../domain-spec-suite — same as a local checkout.
      - uses: actions/checkout@v4
        with:
          repository: dataGriff/domain-spec-suite
          path: domain-spec-suite

      - name: Install Task
        working-directory: .
        run: sh -c "$(curl -L https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install mise
        working-directory: .
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain (.mise.toml)
        run: mise install

      - name: Install suite runner dependency (pyyaml)
        run: mise exec -- python -m pip install pyyaml

      - name: Lint contracts
        run: mise exec -- task lint

      - name: Run full audit
        run: mise exec -- task audit

      - name: Regenerate domain overview
        run: mise exec -- task docs:generate

      - name: Verify generator output is clean
        # Per SUITE-DESIGN.md §8 Phase 7, "clean" means: exit 0 (already
        # confirmed by the step above), no placeholder strings in the
        # rendered HTML, every domain-model entity present in the
        # overview. The entity-coverage check is implemented inside the
        # full audit; here we only assert the placeholder-free property.
        run: |
          OVERVIEW=docs/specifications/domain-overview.html
          if [ ! -f "$OVERVIEW" ]; then
            echo "audit: $OVERVIEW not produced by the generator." >&2
            exit 1
          fi
          if grep -E '\[Resource1\]|\[Domain\]|\{\{' "$OVERVIEW"; then
            echo "audit: placeholder strings found in $OVERVIEW." >&2
            exit 1
          fi
          echo "audit: domain overview is placeholder-clean."
