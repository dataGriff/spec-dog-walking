name: Deploy Docs to GitHub Pages

# Publishes the MkDocs site (with the auto-generated domain overview)
# to GitHub Pages on every push to main. The audit workflow
# (audit.yml) is the gatekeeper that blocks merges if the spec set
# is broken — by the time main moves, the contracts have passed
# the audit, so this workflow just builds and publishes.
#
# Repo setup needed once:
#   Settings → Pages → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows only one concurrent deploy. Queue extras instead of
# cancelling — losing a deploy mid-flight can leave stale content live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Install Task
        run: sh -c "$(curl -L https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: python -m pip install --upgrade pip mkdocs-material pyyaml

      - name: Install datacontract-cli (used by docs:render-datacontract)
        run: pipx install datacontract-cli

      - name: Build docs (regenerates domain overview + datacontract HTML first)
        run: task docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
