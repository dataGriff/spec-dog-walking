name: Deploy Docs to GitHub Pages

# Publishes the MkDocs site (with the auto-generated domain overview)
# to GitHub Pages on every push to main. The audit workflow
# (audit.yml) is the gatekeeper that blocks merges if the spec set
# is broken — by the time main moves, the contracts have passed
# the audit, so this workflow just builds and publishes.
#
# CI mirrors the local developer layout: suite cloned as a sibling,
# tools from .mise.toml, the same `task docs:build` target developers
# and agents run.
#
# Repo setup needed once:
#   Settings → Pages → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows only one concurrent deploy. Queue extras instead of
# cancelling — losing a deploy mid-flight can leave stale content live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec-dog-walking
    steps:
      - uses: actions/checkout@v4
        with:
          path: spec-dog-walking

      # docs:generate delegates to the suite-side overview renderer,
      # resolved as the sibling ../domain-spec-suite.
      - uses: actions/checkout@v4
        with:
          repository: dataGriff/domain-spec-suite
          path: domain-spec-suite

      - uses: actions/configure-pages@v5

      - name: Install Task
        working-directory: .
        run: sh -c "$(curl -L https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install mise
        working-directory: .
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain (.mise.toml)
        run: mise install

      - name: Install suite renderer dependency (pyyaml)
        run: mise exec -- python -m pip install pyyaml

      - name: Build docs (regenerates domain overview + datacontract HTML first)
        run: mise exec -- task docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: spec-dog-walking/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
