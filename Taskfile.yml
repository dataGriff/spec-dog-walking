version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  lint:openapi:
    desc: Lint the OpenAPI spec with Spectral
    cmds:
      - spectral lint docs/specifications/contracts/openapi.yaml --ruleset .spectral-openapi.yaml

  lint:asyncapi:
    desc: Lint the AsyncAPI spec with Spectral
    cmds:
      - spectral lint docs/specifications/contracts/asyncapi.yaml --ruleset .spectral-asyncapi.yaml

  lint:datacontract:
    desc: Lint the ODCS data contract with datacontract-cli
    cmds:
      - datacontract lint docs/specifications/contracts/datacontract.yaml

  lint:
    desc: Run all linting (OpenAPI + AsyncAPI + data contract)
    cmds:
      - task: lint:openapi
      - task: lint:asyncapi
      - task: lint:datacontract

  lint:fix-descriptions:
    desc: Auto-insert `description:` lines on every operationId in openapi.yaml + asyncapi.yaml that lacks one (idempotent). Use to clear Spectral's operation-description / asyncapi-operation-description / asyncapi-tag-description failures in one pass.
    cmds:
      - python3 scripts/lint_fix_descriptions.py

  glossary:skeleton:
    desc: 'Generate glossary.md skeleton from domain-model.md entities + attributes (placeholders for the agent to fill). Idempotent on template glossary; --force to overwrite a real one. Saves ~90 entries of typing on a non-trivial domain.'
    cmds:
      - python3 scripts/glossary_skeleton.py

  openapi:skeleton:
    desc: 'Generate contracts/openapi.yaml skeleton from auth-matrix.md + domain-model.md + error-catalogue.md. Wires Idempotency-Key on every POST. Idempotent on template; --force to overwrite a real one.'
    cmds:
      - python3 scripts/openapi_skeleton.py {{.CLI_ARGS}}

  asyncapi:skeleton:
    desc: 'Generate contracts/asyncapi.yaml skeleton from domain-model.md events + entities + aggregates. Idempotent on template; --force to overwrite a real one.'
    cmds:
      - python3 scripts/asyncapi_skeleton.py {{.CLI_ARGS}}

  datacontract:skeleton:
    desc: 'Generate contracts/datacontract.yaml skeleton from asyncapi.yaml + nfr.md. Run AFTER asyncapi:skeleton. Idempotent on template; --force to overwrite a real one.'
    cmds:
      - python3 scripts/datacontract_skeleton.py {{.CLI_ARGS}}

  docs:render-datacontract:
    desc: Render the data contract as a standalone HTML reference page via datacontract-cli
    cmds:
      - datacontract export html docs/specifications/contracts/datacontract.yaml --output docs/specifications/datacontract-reference.html

  docs:generate:
    desc: 'Generate the domain overview HTML page and the data contract HTML reference. Delegates to the suite-side overview renderer (resolves the suite via DOMAIN_SPEC_SUITE_ROOT or sibling ../domain-spec-suite/).'
    vars:
      SUITE: '{{.DOMAIN_SPEC_SUITE_ROOT | default "../domain-spec-suite"}}'
    cmds:
      - |
        if [ ! -f "{{.SUITE}}/scripts/generate_domain_overview.py" ]; then
          echo "docs:generate: suite not found at '{{.SUITE}}'." >&2
          echo "               set DOMAIN_SPEC_SUITE_ROOT to its location, or clone the" >&2
          echo "               domain-spec-suite as a sibling directory:" >&2
          echo "                 git clone https://github.com/dataGriff/domain-spec-suite ../domain-spec-suite" >&2
          exit 1
        fi
        mise exec -- python3 "{{.SUITE}}/scripts/generate_domain_overview.py" --repo .
      - task: docs:render-datacontract

  docs:serve:
    desc: Serve the MkDocs site locally
    cmds:
      - mkdocs serve

  docs:build:
    desc: Build the MkDocs site (regenerates domain overview first)
    cmds:
      - task: docs:generate
      - mkdocs build

  docs:deploy:
    desc: Deploy docs to GitHub Pages (regenerates domain overview first)
    cmds:
      - task: docs:generate
      - mkdocs gh-deploy --force

  domain:init:
    desc: Copy blank spec templates into docs/specifications/ (safe — does not overwrite unless FORCE=true)
    vars:
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - |
        TEMPLATE_DIR="docs/specifications/_template"
        TARGET_DIR="docs/specifications"
        FORCE="{{.FORCE}}"

        if [ ! -d "$TEMPLATE_DIR" ]; then
          echo "ERROR: Template directory '$TEMPLATE_DIR' not found."
          exit 1
        fi

        echo "Copying spec templates from $TEMPLATE_DIR → $TARGET_DIR"

        copy_file() {
          local src="$1"
          local dst="$2"
          mkdir -p "$(dirname "$dst")"
          if [ -f "$dst" ] && [ "$FORCE" != "true" ]; then
            echo "  SKIP (exists): $dst  (use FORCE=true to overwrite)"
          else
            cp "$src" "$dst"
            echo "  COPIED: $dst"
          fi
        }

        find "$TEMPLATE_DIR" -type f | while read -r src; do
          rel="${src#$TEMPLATE_DIR/}"
          dst="$TARGET_DIR/$rel"
          copy_file "$src" "$dst"
        done

        echo ""
        echo "Done. Edit the files in $TARGET_DIR to describe your domain."
        echo "Then run: task domain:check"

  setup:
    desc: Install all tooling and dependencies (run once after cloning — requires mise)
    cmds:
      - mise install
      - python -m pip install pyyaml
      - task: hooks:install

  hooks:install:
    desc: Install git hooks from .githooks/ (run once after cloning)
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed from .githooks/"

  domain:check:
    desc: Validate the domain contracts and regenerate domain overview docs
    cmds:
      - task: lint
      - task: docs:generate

  audit:
    desc: 'Run the full Phase 7 conformance audit against this spec repo. Resolves the suite via DOMAIN_SPEC_SUITE_ROOT env var (preferred) or sibling ../domain-spec-suite/. Errors with a clear message if neither resolves.'
    vars:
      SUITE: '{{.DOMAIN_SPEC_SUITE_ROOT | default "../domain-spec-suite"}}'
    cmds:
      - |
        if [ ! -f "{{.SUITE}}/shared/run_phase.py" ]; then
          echo "audit: suite not found at '{{.SUITE}}'." >&2
          echo "       set DOMAIN_SPEC_SUITE_ROOT to its location, or clone the" >&2
          echo "       domain-spec-suite as a sibling directory:" >&2
          echo "         git clone https://github.com/dataGriff/domain-spec-suite ../domain-spec-suite" >&2
          exit 1
        fi
        mise exec -- python3 "{{.SUITE}}/shared/run_phase.py" audit --repo .

  audit:cross-file:
    desc: 'Lighter audit variant: cross-reference checks only (skips placeholder, sha256, force-advance, ambiguity, generator). Used by the pre-push hook for a fast pre-push gate.'
    vars:
      SUITE: '{{.DOMAIN_SPEC_SUITE_ROOT | default "../domain-spec-suite"}}'
    cmds:
      - |
        if [ ! -f "{{.SUITE}}/shared/run_phase.py" ]; then
          echo "audit:cross-file: suite not found at '{{.SUITE}}'." >&2
          echo "                  set DOMAIN_SPEC_SUITE_ROOT or sibling-clone the suite." >&2
          exit 1
        fi
        mise exec -- python3 "{{.SUITE}}/shared/run_phase.py" audit --repo . \
          --exclude NO-TEMPLATE-PLACEHOLDERS,SIGNOFF-SHA256-MATCHES,FORCE-ADVANCES-ALL-ACCEPTED,AMBIGUITIES-NO-AUDIT-REQUIRED,GENERATOR-CLEAN-OUTPUT

  review:
    desc: 'Run the qualitative independent review on this spec set. Prereq: audit green. Surfaces inconsistencies, coverage gaps, and semantic contradictions the mechanical checks cannot catch. Invokes the suite via DOMAIN_SPEC_SUITE_ROOT or ../domain-spec-suite/ sibling.'
    vars:
      SUITE: '{{.DOMAIN_SPEC_SUITE_ROOT | default "../domain-spec-suite"}}'
    cmds:
      - |
        if [ ! -f "{{.SUITE}}/scripts/domain_review.py" ]; then
          echo "review: suite not found at '{{.SUITE}}'." >&2
          echo "        set DOMAIN_SPEC_SUITE_ROOT or sibling-clone the suite." >&2
          exit 1
        fi
        mise exec -- python3 "{{.SUITE}}/scripts/domain_review.py" --repo .
